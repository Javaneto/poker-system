<!DOCTYPE html>
<html lang="pt-BR" data-tema-escopo="tv" data-tema-padrao="escuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes — RPG Poker Club</title>

  <script src="js/tema.js"></script>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    /* Mesma paleta do resto do sistema (styles.css). O tema vem de js/tema.js. */
    :root {
      --tv-fundo: #f2f3f7;
      --tv-cartao: #ffffff;
      --tv-cartao-2: #f6f7fa;
      --tv-borda: #e2e4ea;
      --tv-texto: #464c56;
      --tv-forte: #16181d;
      --tv-apagado: #767c88;
      --tv-intervalo: #dc2626;
      --tv-ouro: #d97706;
      --tv-sombra: 0 1px 2px rgba(16,24,40,0.04), 0 1px 8px rgba(16,24,40,0.04);
      --tv-verde: #16a34a;
      --tv-ambar: #d97706;
    }

    html[data-tema="escuro"] {
      --tv-fundo: #07080c;
      --tv-cartao: #0f1117;
      --tv-cartao-2: #151924;
      --tv-borda: #1f2330;
      --tv-texto: #c9ccd4;
      --tv-forte: #ffffff;
      --tv-apagado: #8b91a0;
      --tv-intervalo: #f87171;
      --tv-ouro: #fbbf24;
      --tv-sombra: none;
      --tv-verde: #22c55e;
      --tv-ambar: #f59e0b;
    }

    :root {
      --tv-vermelho: #dc2626;
      --tv-vermelho-escuro: #7f1d1d;
      /* Tudo escala pelo menor lado da tela (vmin) ou pela altura/largura */
      --tv-raio: min(1.6vh, 1.2vw);
      --tv-gap: min(1.8vh, 1.4vw);
      --tv-margem: min(2.4vh, 2vw);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--tv-fundo);
      color: var(--tv-forte);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      font-variant-numeric: tabular-nums;
    }

    .oculto {
      display: none !important;
    }

    /* ---- Barra de cima: marca à esquerda, hora e tela cheia à direita ---- */

    .tv-topo {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2vw;
      /* altura mínima para caber o botão ☰ do menu (36px + 8px de margem) */
      min-height: 52px;
      padding: 1vh var(--tv-margem);
      font-size: min(2.2vh, 1.8vw);
      color: var(--tv-texto);
    }

    .tv-marca {
      display: flex;
      align-items: center;
      gap: min(1vh, 0.8vw);
      font-weight: 800;
      color: var(--tv-forte);
    }

    .tv-marca-logo {
      width: 1.8em;
      height: 1.8em;
      border-radius: 0.45em;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--tv-vermelho), var(--tv-vermelho-escuro));
      color: #fff;
    }

    .tv-topo-direita {
      display: flex;
      align-items: center;
      gap: min(1.2vh, 1vw);
    }

    /* Interruptor sol/lua desta tela (mesmo desenho do resto do sistema,
       medido em "em" para crescer junto com a barra de cima) */
    .tv-tema {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 3.8em;
      height: 2em;
      padding: 0 0.2em;
      border-radius: 999px;
      background: var(--tv-cartao-2);
      border: 1px solid var(--tv-borda);
      font-size: 1em;
      cursor: pointer;
    }

    .tv-tema-bolinha {
      position: absolute;
      top: 0.15em;
      left: 0.15em;
      width: 1.6em;
      height: 1.6em;
      border-radius: 50%;
      background: var(--tv-cartao);
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.25);
      transition: transform .2s ease;
    }

    .tv-tema svg {
      position: relative;
      z-index: 1;
      width: 1em;
      height: 1em;
      margin: 0 0.3em;
      color: var(--tv-apagado);
    }

    .tv-tema .ico-sol { color: #f59e0b; }

    html[data-tema="escuro"] .tv-tema .ico-sol { color: var(--tv-apagado); }
    html[data-tema="escuro"] .tv-tema .ico-lua { color: #fff; }
    html[data-tema="escuro"] .tv-tema-bolinha {
      transform: translateX(1.8em);
      background: var(--tv-borda);
    }

    #tvRelogioParede {
      font-weight: 700;
      color: var(--tv-forte);
    }

    #btnTelaCheiaTV {
      display: grid;
      place-items: center;
      width: 2em;
      height: 2em;
      background: var(--tv-cartao-2);
      color: var(--tv-texto);
      border: 1px solid var(--tv-borda);
      border-radius: 0.5em;
      font-size: 1em;
      cursor: pointer;
    }

    #btnTelaCheiaTV:hover {
      color: var(--tv-forte);
    }

    /* ---- Faixa com o nome do torneio ---- */

    .tv-titulo {
      flex: 0 0 auto;
      margin: 0 var(--tv-margem);
      border-radius: var(--tv-raio);
      background: linear-gradient(90deg, var(--tv-vermelho-escuro), var(--tv-vermelho) 50%, var(--tv-vermelho-escuro));
      color: #fff;
      text-align: center;
      padding: min(1vh, 0.8vw) 2vw;
      font-size: min(3.2vh, 2.4vw);
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #tvConteudo {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* ---- Nível / jogadores / status ---- */

    .tv-cabecalho {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: min(1.4vh, 1.1vw) var(--tv-margem);
      font-size: min(3.2vh, 2.4vw);
      font-weight: 800;
    }

    .tv-cabecalho > :last-child {
      justify-self: end;
    }

    .tv-status {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      padding: 0.15em 0.7em;
      border-radius: 999px;
      background: var(--tv-cartao-2);
      border: 1px solid var(--tv-borda);
      color: var(--tv-texto);
      font-size: 0.8em;
      white-space: nowrap;
    }

    .tv-status::before {
      content: '';
      width: 0.55em;
      height: 0.55em;
      border-radius: 50%;
      background: currentColor;
    }

    .tv-status[data-estado="rodando"] { color: var(--tv-verde); }
    .tv-status[data-estado="pausado"] { color: var(--tv-ambar); }
    .tv-status[data-estado="intervalo"] { color: var(--tv-intervalo); }
    .tv-status[data-estado="encerrado"] { color: var(--tv-apagado); }

    /* ---- Corpo: relógio + blinds à esquerda, tabela à direita.
       A grade faz a tabela ter exatamente o mesmo topo e a mesma base
       que o bloco da esquerda (sem descasamento). ---- */

    .tv-corpo {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas:
        "relogio painel"
        "blinds  painel";
      gap: var(--tv-gap);
      padding: 0 var(--tv-margem);
    }

    .tv-contador-caixa,
    .tv-blinds-caixa,
    .tv-painel {
      background: var(--tv-cartao);
      border: 1px solid var(--tv-borda);
      border-radius: var(--tv-raio);
      min-width: 0;
      min-height: 0;
      box-shadow: var(--tv-sombra);
    }

    .tv-contador-caixa {
      grid-area: relogio;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .tv-contador {
      font-size: min(15.5vw, 34vh);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      transition: color .3s ease;
    }

    .tv-contador.intervalo {
      color: var(--tv-intervalo);
    }

    .tv-blinds-caixa {
      grid-area: blinds;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: min(1.4vh, 1.1vw) 2vw min(1.8vh, 1.4vw);
    }

    .tv-rotulo {
      font-size: min(2vh, 1.5vw);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--tv-apagado);
    }

    .tv-blinds {
      font-size: min(8vh, 5.4vw);
      font-weight: 800;
      line-height: 1.1;
      text-align: center;
    }

    /* Tabela: as linhas dividem a altura igualmente e preenchem o cartão */
    .tv-painel {
      grid-area: painel;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tv-linha {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1vw;
      padding: 0 min(2.4vh, 1.8vw);
      font-size: min(3.4vh, 2.3vw);
      font-weight: 700;
      color: var(--tv-texto);
      white-space: nowrap;
    }

    .tv-linha + .tv-linha {
      border-top: 1px solid var(--tv-borda);
    }

    .tv-linha:nth-child(even) {
      background: var(--tv-cartao-2);
    }

    .tv-linha > :last-child {
      color: var(--tv-forte);
      font-weight: 800;
    }

    .tv-linha-destaque {
      background: linear-gradient(90deg, rgba(220, 38, 38, .22), rgba(220, 38, 38, .08)) !important;
      color: var(--tv-forte);
    }

    /* ---- Premiação ---- */

    .tv-premios {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: var(--tv-gap);
      flex-wrap: wrap;
      padding: var(--tv-gap) var(--tv-margem) var(--tv-margem);
    }

    .tv-premios:empty {
      padding: 0 0 var(--tv-margem);
    }

    .tv-premio {
      display: flex;
      align-items: baseline;
      gap: 0.22em;
      padding: 0.25em 0.8em;
      background: var(--tv-cartao);
      border: 1px solid var(--tv-borda);
      border-radius: var(--tv-raio);
      box-shadow: var(--tv-sombra);
      font-size: min(5.2vh, 3.6vw);
      font-weight: 800;
    }

    .tv-premio-pos {
      color: var(--tv-vermelho);
    }

    .tv-premio:first-child .tv-premio-pos {
      color: var(--tv-ouro);
    }

    .tv-vazio {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--tv-apagado);
      font-size: min(4vh, 3vw);
    }

    /* Tela cheia: esconde a barra de cima e o cursor parado */
    body.tela-cheia .tv-topo {
      display: none;
    }

    body.tela-cheia .tv-titulo {
      margin-top: var(--tv-margem);
    }

    body.tela-cheia.cursor-oculto,
    body.tela-cheia.cursor-oculto * {
      cursor: none !important;
    }

    /* Tela em pé (celular, tablet ou TV na vertical): relógio em cima,
       blinds e tabela embaixo, tamanhos baseados na largura. */
    @media (orientation: portrait), (max-aspect-ratio: 1/1) {

      :root {
        --tv-raio: 2.4vw;
        --tv-gap: 2.4vw;
        --tv-margem: 3vw;
      }

      html, body {
        overflow-y: auto;
      }

      body {
        min-height: 100%;
        height: auto;
      }

      .tv-topo {
        font-size: 3.6vw;
        padding: 1.2vh 3vw;
      }

      .tv-titulo {
        font-size: 5vw;
        padding: 1.2vw 3vw;
      }

      .tv-cabecalho {
        font-size: 4.2vw;
        padding: 2.4vw 3vw;
      }

      .tv-corpo {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto auto;
        grid-template-areas:
          "relogio"
          "blinds"
          "painel";
      }

      .tv-contador-caixa {
        padding: 3vw 0;
      }

      .tv-contador {
        font-size: 25vw;
      }

      .tv-rotulo {
        font-size: 3vw;
      }

      .tv-blinds {
        font-size: 9vw;
      }

      .tv-linha {
        flex: 0 0 auto;
        font-size: 4.2vw;
        padding: 2.6vw 3.4vw;
      }

      .tv-premio {
        font-size: 5.6vw;
      }

      .tv-vazio {
        font-size: 5vw;
        padding: 0 6vw;
      }
    }

    /* Telas muito baixas e largas (celular deitado) */
    @media (orientation: landscape) and (max-height: 500px) {

      .tv-topo { padding: 0.6vh var(--tv-margem); font-size: min(3.4vh, 1.8vw); }
      .tv-titulo { font-size: min(4.4vh, 2.4vw); }
      .tv-cabecalho { font-size: min(4.4vh, 2.4vw); }
      .tv-linha { font-size: min(4.4vh, 2.3vw); }
      .tv-rotulo { font-size: min(3vh, 1.5vw); }
      .tv-premio { font-size: min(6vh, 3.6vw); }
    }
  </style>
</head>

  // ---- Tela cheia (botão ⛶, tecla F ou duplo clique no relógio) ----

  function alternarTelaCheiaTV() {

    const el = document.documentElement;
    const emTelaCheia = document.fullscreenElement || document.webkitFullscreenElement;

    if (emTelaCheia) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return;
    }

    const pedir = el.requestFullscreen || el.webkitRequestFullscreen;

    if (pedir) {
      Promise.resolve(pedir.call(el)).catch(() => document.body.classList.toggle('tela-cheia'));
    } else {
      // iPhone não tem tela cheia de verdade: só esconde a barra de cima.
      document.body.classList.toggle('tela-cheia');
    }
  }

  function aoMudarTelaCheia() {
    const ativo = !!(document.fullscreenElement || document.webkitFullscreenElement);
    document.body.classList.toggle('tela-cheia', ativo);
  }

  document.addEventListener('fullscreenchange', aoMudarTelaCheia);
  document.addEventListener('webkitfullscreenchange', aoMudarTelaCheia);

  document.addEventListener('keydown', e => {
    if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) {
      alternarTelaCheiaTV();
    }
    if (e.key === 'Escape' && document.body.classList.contains('tela-cheia') && !document.fullscreenElement) {
      document.body.classList.remove('tela-cheia');
    }
  });

  document.getElementById('tvContador').addEventListener('dblclick', alternarTelaCheiaTV);

  // Em tela cheia, o cursor some depois de 3 s parado.
  let timerCursorTV = null;

  document.addEventListener('mousemove', () => {
    document.body.classList.remove('cursor-oculto');
    clearTimeout(timerCursorTV);
    timerCursorTV = setTimeout(() => document.body.classList.add('cursor-oculto'), 3000);
  });





  function obterNiveisTorneioAtual() {

    if (!torneioAtual) return [];

    const estrutura = estruturasBlinds.find(e => e.id === torneioAtual.estrutura_blinds_id);

    return estrutura ? (estrutura.niveis || []) : [];
  }

  function calcularSegundosRestantesClock() {

    if (!torneioAtual) return 0;

    const niveis = obterNiveisTorneioAtual();

    if (niveis.length === 0) return 0;

    const indiceAtual = Math.min(torneioAtual.relogio_nivel_atual || 0, niveis.length - 1);
    const nivel = niveis[indiceAtual];

    const base = torneioAtual.relogio_segundos_restantes ?? ((nivel?.duracao || 0) * 60);

    if (!torneioAtual.relogio_rodando || !torneioAtual.relogio_iniciado_em) {
      return base;
    }

    const decorrido = Math.floor((Date.now() - new Date(torneioAtual.relogio_iniciado_em).getTime()) / 1000);

    return Math.max(base - decorrido, 0);
  }

  function calcularNovoTempoDecorridoAcumulado() {

    if (!torneioAtual) return 0;

    const acumulado = Number(torneioAtual.tempo_decorrido_segundos) || 0;

    if (!torneioAtual.relogio_rodando || !torneioAtual.relogio_iniciado_em) {
      return acumulado;
    }

    const decorridoDesdeInicio = Math.floor((Date.now() - new Date(torneioAtual.relogio_iniciado_em).getTime()) / 1000);

    return acumulado + Math.max(decorridoDesdeInicio, 0);
  }

  async function executarAvancoNivelClock() {

    if (!torneioAtual) return;

    if (avancoNivelEmAndamento) return;

    avancoNivelEmAndamento = true;

    const niveis = obterNiveisTorneioAtual();
    const indiceAtual = torneioAtual.relogio_nivel_atual || 0;
    const nivelAtual = niveis[indiceAtual];
    const emIntervalo = !!torneioAtual.relogio_em_intervalo;

    let novosDados;

    if (emIntervalo && !torneioAtual.relogio_intervalo_avanca_nivel) {

      // intervalo manual termina (ou foi encerrado em outra tela) -> retoma o nível de onde parou
      novosDados = {
        relogio_em_intervalo: false,
        relogio_intervalo_avanca_nivel: false,
        relogio_segundos_restantes: torneioAtual.relogio_segundos_pre_intervalo ?? ((nivelAtual?.duracao || 0) * 60),
        relogio_segundos_pre_intervalo: null,
        relogio_iniciado_em: new Date().toISOString(),
        relogio_rodando: true,
        tempo_decorrido_segundos: calcularNovoTempoDecorridoAcumulado()
      };

    } else if (emIntervalo) {

      // intervalo estruturado (entre níveis) termina -> avança de nível
      const proximoIndice = Math.min(indiceAtual + 1, niveis.length - 1);
      const proximoNivel = niveis[proximoIndice];

      novosDados = {
        relogio_nivel_atual: proximoIndice,
        relogio_em_intervalo: false,
        relogio_intervalo_avanca_nivel: false,
        relogio_segundos_pre_intervalo: null,
        relogio_segundos_restantes: (proximoNivel?.duracao || 0) * 60,
        relogio_iniciado_em: new Date().toISOString(),
        relogio_rodando: true,
        tempo_decorrido_segundos: calcularNovoTempoDecorridoAcumulado()
      };

    } else if (nivelAtual && Number(nivelAtual.pausa) > 0) {

      // nível termina e tem pausa configurada -> entra em intervalo estruturado
      novosDados = {
        relogio_em_intervalo: true,
        relogio_intervalo_avanca_nivel: true,
        relogio_segundos_restantes: Number(nivelAtual.pausa) * 60,
        relogio_iniciado_em: new Date().toISOString(),
        relogio_rodando: true,
        tempo_decorrido_segundos: calcularNovoTempoDecorridoAcumulado()
      };

    } else {

      // nível termina sem pausa -> avança direto
      const proximoIndice = Math.min(indiceAtual + 1, niveis.length - 1);
      const proximoNivel = niveis[proximoIndice];

      novosDados = {
        relogio_nivel_atual: proximoIndice,
        relogio_em_intervalo: false,
        relogio_segundos_restantes: (proximoNivel?.duracao || 0) * 60,
        relogio_iniciado_em: new Date().toISOString(),
        relogio_rodando: true,
        tempo_decorrido_segundos: calcularNovoTempoDecorridoAcumulado()
      };
    }

    const iniciadoEmEsperado = torneioAtual.relogio_iniciado_em;

    // Atualização otimista: reflete na tela imediatamente, sem esperar o próximo carregarDados()
    torneioAtual = { ...torneioAtual, ...novosDados };
    atualizarTela();

    let query = client.from('torneios').update(novosDados).eq('id', torneioAtual.id);

    query = iniciadoEmEsperado
      ? query.eq('relogio_iniciado_em', iniciadoEmEsperado)
      : query.is('relogio_iniciado_em', null);

    const { data, error } = await query.select();

    avancoNivelEmAndamento = false;

    if (error) {
      console.error(error);
      await carregarDados();
      return;
    }

    if (!data || data.length === 0) {
      // Outra tela (Diretor ou Detalhes) já processou este avanço primeiro.
      // Não fazemos nada além de ressincronizar com o estado real do banco.
      console.log('Avanço já processado por outra tela; ressincronizando.');
      await carregarDados();
      return;
    }

    await carregarDados();
  }

  function formatarTempoRelogio(segundos) {

    const s = Math.max(Math.floor(segundos), 0);
    const min = Math.floor(s / 60);
    const seg = s % 60;

    return `${String(min).padStart(2, '0')}:${String(seg).padStart(2, '0')}`;
  }

  function formatarValorBlind(valor) {

    const n = Number(valor) || 0;

    if (n < 1000) return String(n);

    const emK = Math.round((n / 1000) * 10) / 10;
    const texto = Number.isInteger(emK) ? String(emK) : emK.toFixed(1).replace('.', ',');

    return `${texto}K`;
  }

  function formatarMoedaSemZeros(valor) {

    const arredondado = Math.round(Number(valor) * 100) / 100;

    return arredondado.toLocaleString('pt-BR', {
      style: 'currency',
      currency: 'BRL',
      minimumFractionDigits: Number.isInteger(arredondado) ? 0 : 2
    });
  }

  function formatarMoeda(valor) {

    return (Number(valor) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function calcularValoresPremiacaoArredondados(totalPrize, percentuais) {

    const unidade = Number(torneioAtual?.arredondamento_premiacao);

    if (!unidade || unidade <= 0) {
      return percentuais.map(pct => totalPrize * (Number(pct) / 100));
    }

    let sobra = 0;
    const resultados = [];

    percentuais.forEach(pct => {

      const bruto = totalPrize * (Number(pct) / 100) + sobra;

      const multiplos = Math.floor(bruto / unidade);
      const fracao = (bruto - multiplos * unidade) / unidade;

      const valor = fracao >= 0.6 ? (multiplos + 1) * unidade : multiplos * unidade;

      sobra = bruto - valor;

      resultados.push(valor);
    });

    if (resultados.length > 0) {
      resultados[resultados.length - 1] = Math.round((resultados[resultados.length - 1] + sobra) * 100) / 100;
    }

    return resultados;
  }

  function formatarTempoDecorrido(segundos) {

    const s = Math.max(Math.floor(segundos), 0);
    const h = Math.floor(s / 3600);
    const min = Math.floor((s % 3600) / 60);

    return `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
  }

  function calcularSegundosAteProximoIntervalo() {

    if (!torneioAtual) return null;

    const niveis = obterNiveisTorneioAtual();

    if (niveis.length === 0) return null;

    const indiceAtual = Math.min(torneioAtual.relogio_nivel_atual || 0, niveis.length - 1);
    const emIntervalo = !!torneioAtual.relogio_em_intervalo;

    if (emIntervalo) return 0;

    const restanteAtual = calcularSegundosRestantesClock();
    const nivelAtual = niveis[indiceAtual];

    if (Number(nivelAtual?.pausa) > 0) {
      return restanteAtual;
    }

    let acumulado = restanteAtual;

    for (let i = indiceAtual + 1; i < niveis.length; i++) {

      acumulado += (niveis[i].duracao || 0) * 60;

      if (Number(niveis[i].pausa) > 0) {
        return acumulado;
      }
    }

    return null;
  }

  function atualizarRelogioParede() {

    document.getElementById('tvRelogioParede').textContent = new Date().toLocaleTimeString('pt-BR', {
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  async function carregarDados() {

    const { data: configuracaoDB } = await client
      .from('configuracoes')
      .select('*')
      .eq('id', 1)
      .single();

    const torneioAtualId = configuracaoDB?.torneio_atual_id || null;

    if (!torneioAtualId) {
      torneioAtual = null;
      atualizarTela();
      return;
    }

    const { data: torneioDB } = await client
      .from('torneios')
      .select('*')
      .eq('id', torneioAtualId)
      .single();

    torneioAtual = torneioDB || null;

    if (!torneioAtual) {
      atualizarTela();
      return;
    }

    const { data: valoresDB } = await client
      .from('torneio_valores')
      .select('*')
      .eq('torneio_id', torneioAtualId);

    valoresTorneio = valoresDB || [];

    const { data: movsDB } = await client
      .from('movimentacoes')
      .select('*')
      .eq('torneio_id', torneioAtualId);

    movimentacoesTorneio = movsDB || [];

    const { data: estruturasDB } = await client
      .from('premiacao_estruturas')
      .select('*');

    estruturasPremiacao = estruturasDB || [];

    const { data: estruturasBlindsDB } = await client
      .from('estruturas_blinds')
      .select('*');

    estruturasBlinds = estruturasBlindsDB || [];

    atualizarTela();
  }

  function atualizarTela() {

    if (!torneioAtual) {
      document.getElementById('tvNomeTorneio').textContent = 'Nenhum torneio ativo';
      document.getElementById('tvConteudo').classList.add('oculto');
      document.getElementById('tvVazio').classList.remove('oculto');
      return;
    }

    document.getElementById('tvVazio').classList.add('oculto');
    document.getElementById('tvConteudo').classList.remove('oculto');

    document.getElementById('tvNomeTorneio').textContent = torneioAtual.nome;

    const niveis = obterNiveisTorneioAtual();
    const indiceAtual = Math.min(torneioAtual.relogio_nivel_atual || 0, Math.max(niveis.length - 1, 0));
    const nivelAtual = niveis[indiceAtual];
    const nivelProximo = niveis[indiceAtual + 1];
    const emIntervalo = !!torneioAtual.relogio_em_intervalo;

    document.getElementById('tvNivel').textContent = emIntervalo ? '— Intervalo' : (indiceAtual + 1);

    const restante = calcularSegundosRestantesClock();
    const contadorEl = document.getElementById('tvContador');

    contadorEl.textContent = formatarTempoRelogio(restante);
    contadorEl.classList.toggle('intervalo', emIntervalo);

    if (torneioAtual.status !== 'encerrado' && torneioAtual.relogio_rodando && restante <= 0 && !avancoNivelEmAndamento) {
      executarAvancoNivelClock();
    }

    let status = 'Pausado';
    let estado = 'pausado';

    if (torneioAtual.status === 'encerrado') {
      status = 'Encerrado';
      estado = 'encerrado';
    } else if (emIntervalo) {
      status = 'Intervalo';
      estado = 'intervalo';
    } else if (torneioAtual.relogio_rodando) {
      status = 'Em Andamento';
      estado = 'rodando';
    }

    const statusEl = document.getElementById('tvStatus');
    statusEl.textContent = status;
    statusEl.dataset.estado = estado;

    if (niveis.length === 0) {
      document.getElementById('tvBlindsAtuais').textContent = 'Sem estrutura de blinds';
      document.getElementById('tvProximoBlind').textContent = '-';
      document.getElementById('tvProximoAnte').textContent = '-';
    } else if (emIntervalo) {
      document.getElementById('tvBlindsAtuais').textContent = 'Intervalo';
      document.getElementById('tvProximoBlind').textContent = nivelProximo ? `${formatarValorBlind(nivelProximo.sb)} / ${formatarValorBlind(nivelProximo.bb)}` : 'Último nível';
      document.getElementById('tvProximoAnte').textContent = nivelProximo ? formatarValorBlind(nivelProximo.ante || 0) : '-';
    } else {
      document.getElementById('tvBlindsAtuais').textContent = nivelAtual
        ? `${formatarValorBlind(nivelAtual.sb)} / ${formatarValorBlind(nivelAtual.bb)} - ${formatarValorBlind(nivelAtual.ante || 0)}`
        : '-';
      document.getElementById('tvProximoBlind').textContent = nivelProximo ? `${formatarValorBlind(nivelProximo.sb)} / ${formatarValorBlind(nivelProximo.bb)}` : 'Último nível';
      document.getElementById('tvProximoAnte').textContent = nivelProximo ? formatarValorBlind(nivelProximo.ante || 0) : '-';
    }

    const segundosProximoIntervalo = calcularSegundosAteProximoIntervalo();

    document.getElementById('tvProximoIntervalo').textContent = segundosProximoIntervalo === null
      ? 'Nenhum'
      : formatarTempoRelogio(segundosProximoIntervalo);

    document.getElementById('tvTempoDecorrido').textContent = formatarTempoDecorrido(calcularNovoTempoDecorridoAcumulado());

    const entradas = movimentacoesTorneio.filter(
      m => m.tipo === 'Entrada' || m.tipo === 'Registro' || m.tipo === 'Rebuy'
    ).length;

    document.getElementById('tvEntradas').textContent = entradas;

    const jogadoresRegistrados = new Set(
      movimentacoesTorneio.filter(m => NOMES_BUYIN.includes(m.tipo_registro)).map(m => m.jogador)
    );

    document.getElementById('tvEntradasTopo').textContent = `${jogadoresRegistrados.size} Jogadores`;

    const bounty = valoresTorneio.find(v => v.tipo === 'Bounty (K.O.)');

    document.getElementById('tvBounty').textContent = (bounty && Number(bounty.valor_total) > 0)
      ? formatarMoeda(Number(bounty.valor_total))
      : 'N/D';

    const totalPrize = movimentacoesTorneio.reduce((soma, mov) => soma + Number(mov.valor_prize || 0), 0)
      + Number(torneioAtual.ajuste_premiacao || 0);

    document.getElementById('tvPremioTotal').textContent = formatarMoeda(totalPrize);

    const estruturaPremiacao = estruturasPremiacao.find(e => e.id === torneioAtual.premiacao_estrutura_id);
    const premiosEl = document.getElementById('tvPremios');

    premiosEl.innerHTML = '';

    if (estruturaPremiacao) {

      const percentuais = estruturaPremiacao.percentuais || [];
      const valores = calcularValoresPremiacaoArredondados(totalPrize, percentuais);

      valores.forEach((valor, index) => {

        const premio = document.createElement('span');
        premio.className = 'tv-premio';

        const posicao = document.createElement('span');
        posicao.className = 'tv-premio-pos';
        posicao.textContent = `${index + 1}º`;

        premio.append(posicao, formatarMoedaSemZeros(valor));
        premiosEl.appendChild(premio);
      });
    }
  }
