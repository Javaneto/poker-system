<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Game — RPG Poker Club</title>

  <script src="js/tema.js"></script>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/comum.js"></script>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="cash.css">
</head>
<body>
<script src="js/menu.js"></script>

<div class="container">

  <header class="pagina-cabecalho">
    <div>
      <span class="pagina-sobretitulo">Operação</span>
      <h1>Cash Game</h1>
      <p class="pagina-subtitulo">Controle de compras, devoluções, rake e caixinha por mesa</p>
    </div>

    <button id="btnNovaMesa" class="btn-red btn-com-icone disabled" onclick="abrirModalNovaMesa()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Nova Mesa</span>
    </button>
  </header>

  <div class="card">
    <div class="torneios-filtros">
      <div id="filtroSegmentado" class="segmentado" role="group" aria-label="Filtrar mesas por status">
        <button type="button" data-valor="ativo" class="ativo" aria-pressed="true" onclick="filtrarMesas('ativo')">Ativas</button>
        <button type="button" data-valor="encerrado" aria-pressed="false" onclick="filtrarMesas('encerrado')">Encerradas</button>
        <button type="button" data-valor="" aria-pressed="false" onclick="filtrarMesas('')">Todas</button>
      </div>
    </div>

    <div id="listaMesas" class="grid-torneios">
      <p style="color:var(--apagado);">Carregando...</p>
    </div>
  </div>

</div>

<div id="modalNovaMesa" class="modal-overlay">
  <div class="modal-box cg-modal" style="max-width:420px;">
    <h2>Nova Mesa</h2>
    <p class="cg-modal-sub">Abre uma mesa de Cash Game para registrar compras, devoluções, rake e caixinha.</p>

    <label class="cg-rotulo" for="novaMesaNome">Nome da mesa</label>
    <input type="text" id="novaMesaNome" maxlength="60" autocomplete="off">

    <label class="cg-rotulo" for="novaMesaObs">Observação (opcional)</label>
    <input type="text" id="novaMesaObs" maxlength="200" autocomplete="off" placeholder="Ex.: NL 1/2">

    <div class="modal-acoes" style="margin-top:8px;">
      <button class="btn-gray" onclick="fecharModalNovaMesa()">Cancelar</button>
      <button id="btnCriarMesa" class="btn-red" style="flex:1;" onclick="criarMesa()">Abrir mesa</button>
    </div>
  </div>
</div>

<div id="modalAlerta" class="modal-overlay">
  <div class="modal-box" style="max-width:380px;">
    <h2>Aviso</h2>
    <p id="alertaMensagem" class="modal-resumo"></p>
    <div class="modal-acoes">
      <button class="btn-dark" style="flex:1;" onclick="confirmarAlerta()">OK</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://rpohgkhkfzuorngtellg.supabase.co';

  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwb2hna2hrZnp1b3JuZ3RlbGxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NDA1NzcsImV4cCI6MjA5NDAxNjU3N30.ub-kiIOB2pm6o7Z5iv1dPuTE4hKwhmz6PraRgTts-Js';

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const ICONE_RELOGIO = '<svg class="cg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  const ICONE_PESSOAS = '<svg class="cg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.8 0 5 2 5 5"/></svg>';
  const ICONE_MESA = '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v10H3z"/><circle cx="12" cy="12" r="2.5"/><path d="M6 10v4M18 10v4"/></svg>';

  let mesas = [];
  let assentos = [];
  let movsMesas = [];
  let filtroStatus = 'ativo';
  let adminLiberado = false;
  let tabelasFaltando = false;

  function escapeHtml(valor) {
    return String(valor ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  let _resolveAlerta = null;

  function mostrarAlerta(mensagem) {
    return new Promise(resolve => {
      document.getElementById('alertaMensagem').textContent = mensagem;
      document.getElementById('modalAlerta').classList.add('aberto');
      _resolveAlerta = resolve;
    });
  }

  function confirmarAlerta() {
    document.getElementById('modalAlerta').classList.remove('aberto');
    if (_resolveAlerta) { const r = _resolveAlerta; _resolveAlerta = null; r(); }
  }

  // ---------- dados ----------

  function carregarDados() {
    return executarSerial('dados-mesas', carregarDadosAgora);
  }

  async function carregarDadosAgora() {

    const { data: mesasDB, error } = await client
      .from('cash_mesas')
      .select('*')
      .order('iniciado_em', { ascending: false });

    if (error) {
      console.error(error);
      tabelasFaltando = /cash_mesas/.test(error.message || '');
      mesas = [];
      renderizar(error);
      return;
    }

    tabelasFaltando = false;
    mesas = mesasDB || [];

    const { data: assentosDB } = await client.from('cash_mesa_jogadores').select('mesa_id,levantou_em');
    assentos = assentosDB || [];

    movsMesas = await buscarTodas(() => client
      .from('movimentacoes')
      .select('id,mesa_id,tipo,valor')
      .not('mesa_id', 'is', null)
      .order('id', { ascending: true }));

    renderizar();
  }

  // ---------- lista ----------

  function filtrarMesas(valor) {

    filtroStatus = valor;

    document.querySelectorAll('#filtroSegmentado button').forEach(b => {
      const ativo = b.dataset.valor === valor;
      b.classList.toggle('ativo', ativo);
      b.setAttribute('aria-pressed', ativo ? 'true' : 'false');
    });

    renderizar();
  }

  function mostrarListaVazia(lista, mensagem) {
    lista.innerHTML = `
      <div class="lista-vazia">
        <span class="lista-vazia-icone">${ICONE_MESA}</span>
        <p>${mensagem}</p>
      </div>
    `;
  }

  function renderizar(erro) {

    const lista = document.getElementById('listaMesas');

    if (tabelasFaltando) {
      mostrarListaVazia(lista, 'As mesas de Cash Game ainda não foram ativadas. Rode o arquivo <strong>sql/008_cash_mesas.sql</strong> no Supabase.');
      return;
    }

    if (erro) {
      mostrarListaVazia(lista, 'Não foi possível carregar as mesas. Tente atualizar a página.');
      return;
    }

    const filtradas = filtroStatus ? mesas.filter(m => m.status === filtroStatus) : mesas;

    if (mesas.length === 0) {
      mostrarListaVazia(lista, 'Nenhuma mesa aberta ainda. Toque em <strong>Nova Mesa</strong> para começar.');
      return;
    }

    if (filtradas.length === 0) {
      mostrarListaVazia(lista, filtroStatus === 'ativo' ? 'Nenhuma mesa ativa agora.' : 'Nenhuma mesa encontrada com esse filtro.');
      return;
    }

    lista.innerHTML = filtradas.map(mesa => {

      const encerrada = mesa.status === 'encerrado';
      const sentados = assentos.filter(a => a.mesa_id === mesa.id && !a.levantou_em).length;
      const movs = movsMesas.filter(m => m.mesa_id === mesa.id);
      const compras = movs.filter(m => m.tipo === 'Entrada').reduce((s, m) => s + Number(m.valor || 0), 0);
      const devolucoes = movs.filter(m => m.tipo === 'Saída').reduce((s, m) => s + Number(m.valor || 0), 0);

      return `
        <a class="cg-mesa-card" href="cash-mesa.html?id=${encodeURIComponent(mesa.id)}">
          <div class="cg-mesa-topo">
            <h3>${escapeHtml(mesa.nome)}</h3>
            <span class="cg-badge ${encerrada ? 'encerrado' : 'ativo'}">${encerrada ? 'Encerrada' : 'Ativa'}</span>
          </div>
          <div class="cg-mesa-linha">${ICONE_RELOGIO}<span>${encerrada ? 'Encerrada' : 'Iniciada'}: ${formatarDataHora(encerrada ? mesa.encerrado_em : mesa.iniciado_em)}</span></div>
          ${mesa.observacao ? `<div class="cg-mesa-linha">${escapeHtml(mesa.observacao)}</div>` : ''}
          <div class="cg-mesa-numeros">
            <div><span>Sentados</span><strong>${sentados}</strong></div>
            <div><span>Compras</span><strong>${formatarMoeda(compras)}</strong></div>
            <div><span>Devoluções</span><strong>${formatarMoeda(devolucoes)}</strong></div>
          </div>
          <div class="cg-mesa-linha">${ICONE_PESSOAS}<span>${encerrada ? 'Ver fechamento' : 'Abrir mesa'}</span></div>
        </a>
      `;
    }).join('');
  }

  // ---------- nova mesa ----------

  function abrirModalNovaMesa() {

    if (!adminLiberado) return;

    if (tabelasFaltando) {
      mostrarAlerta('Rode o arquivo sql/008_cash_mesas.sql no Supabase antes de abrir mesas.');
      return;
    }

    const usados = new Set(mesas.map(m => m.nome.toLowerCase()));
    let n = 1;
    while (usados.has(`mesa ${n}`)) n++;

    document.getElementById('novaMesaNome').value = `Mesa ${n}`;
    document.getElementById('novaMesaObs').value = '';
    document.getElementById('modalNovaMesa').classList.add('aberto');

    setTimeout(() => document.getElementById('novaMesaNome').select(), 50);
  }

  function fecharModalNovaMesa() {
    document.getElementById('modalNovaMesa').classList.remove('aberto');
  }

  async function criarMesa() {

    const nome = document.getElementById('novaMesaNome').value.trim().replace(/\s+/g, ' ');
    const observacao = document.getElementById('novaMesaObs').value.trim();

    if (!nome) {
      await mostrarAlerta('Informe o nome da mesa');
      return;
    }

    const btn = document.getElementById('btnCriarMesa');
    btn.classList.add('disabled');

    const { data, error } = await client
      .from('cash_mesas')
      .insert([{ nome, observacao: observacao || null }])
      .select()
      .single();

    btn.classList.remove('disabled');

    if (error) {
      console.error(error);
      await mostrarAlerta('Erro ao abrir a mesa. Tente de novo.');
      return;
    }

    location.href = `cash-mesa.html?id=${encodeURIComponent(data.id)}`;
  }

  document.getElementById('novaMesaNome').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); criarMesa(); }
  });

  // ---------- início ----------

  async function sair() {
    await client.auth.signOut();
    window.location.href = 'login.html';
  }

  client.auth.onAuthStateChange((event, session) => {
    if (!session && event === 'SIGNED_OUT') {
      window.location.href = 'login.html?redirect=' + encodeURIComponent('index.html');
    }
  });

  (async function inicializar() {

    const { data } = await client.auth.getSession();

    if (!data.session) {
      window.location.href = 'login.html?redirect=' + encodeURIComponent('index.html');
      return;
    }

    adminLiberado = true;
    document.getElementById('btnNovaMesa').classList.remove('disabled');

    await carregarDados();

    iniciarRealtimeRobusto({
      nome: 'cash-mesas-realtime',
      tabelas: ['cash_mesas', 'cash_mesa_jogadores', 'movimentacoes'],
      aoMudar: () => carregarDados()
    });
  })();
</script>

</body>
</html>
