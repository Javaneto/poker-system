<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Game — RPG Poker Club</title>

  <script src="js/tema.js"></script>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/comum.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="js/menu.js"></script>

<div class="container">

  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">

      <h1 style="margin:0;">Cash Game</h1>
    </div>
  </div>

  <div class="card">
    <h2>Registrar Movimentação</h2>

    <div class="pesquisa-wrapper">
      <input
        enterkeyhint="done"
        autocapitalize="words"
        spellcheck="false"
        type="text"
        id="pesquisaJogador"
        placeholder="Pesquisar jogador"
        autocomplete="off"
        oninput="filtrarJogadores()"
      >

      <div id="sugestoesJogadores"></div>
    </div>

    <select id="jogadorSelect" class="oculto"></select>

    <div class="flex flex-lado-a-lado">
      <div>
        <input type="number" id="entrada" placeholder="Entrada" min="0">

        <button id="btnEntrada" class="btn-blue disabled" onclick="adicionarEntrada()">
          Adicionar Entrada
        </button>
      </div>

      <div>
        <input type="number" id="saida" placeholder="Saída" min="0">

        <button id="btnSaida" class="btn-green disabled" onclick="adicionarSaida()">
          Adicionar Saída
        </button>
      </div>
    </div>
  </div>

</div>


<div id="modalCadastro" class="modal-overlay">
  <div class="modal-box">
    <h2>Cadastrar Jogador</h2>

    <input type="text" id="cadastroNome" placeholder="Nome">
    <input type="text" id="cadastroTelefone" placeholder="Telefone">
    <input type="text" id="cadastroCpf" placeholder="CPF">

    <div class="modal-acoes">
      <button class="btn-gray" onclick="fecharModalCadastro()">
        Cancelar
      </button>

      <button id="btnCadastrarJogador" class="btn-dark" onclick="cadastrarJogador()">
        Cadastrar Jogador
      </button>
    </div>
  </div>
</div>

<div id="modalConfirmacao" class="modal-overlay">
  <div class="modal-box">
    <h2>Confirmar Entrada</h2>

    <p id="modalResumo" class="modal-resumo"></p>

    <div class="modalidade-opcoes">
      <button type="button" id="btnModalidadeCash" class="modalidade-btn ativo" onclick="selecionarModalidade('Não Pago')">
        Não Pago
      </button>

      <button type="button" id="btnModalidadeTorneio" class="modalidade-btn" onclick="selecionarModalidade('Pago')">
        Pago
      </button>
    </div>

    <div class="modal-acoes">
      <button class="btn-gray" onclick="fecharModalConfirmacao()">
        Cancelar
      </button>

      <button id="btnConfirmarEntrada" class="btn-blue" onclick="confirmarEntradaComModalidade()">
        Confirmar
      </button>
    </div>
  </div>
</div>

<div id="modalConfirmacaoSaida" class="modal-overlay">
  <div class="modal-box">
    <h2>Confirmar Saída</h2>

    <p id="modalResumoSaida" class="modal-resumo"></p>

    <div class="modal-acoes">
      <button class="btn-gray" onclick="fecharModalConfirmacaoSaida()">
        Cancelar
      </button>

      <button id="btnConfirmarSaida" class="btn-green" onclick="confirmarSaidaComModalidade()">
        Confirmar
      </button>
    </div>
  </div>
</div>

<div id="modalAlerta" class="modal-overlay">
  <div class="modal-box" style="max-width:380px;">
    <h2>Aviso</h2>

    <p id="alertaMensagem" class="modal-resumo"></p>

    <div class="modal-acoes">
      <button class="btn-dark" style="flex:1;" onclick="confirmarAlerta()">
        OK
      </button>
    </div>
  </div>
</div>

<div id="modalConfirm" class="modal-overlay">
  <div class="modal-box" style="max-width:380px;">
    <h2>Confirmar</h2>

    <p id="confirmMensagem" class="modal-resumo"></p>

    <div class="modal-acoes">
      <button class="btn-gray" onclick="responderConfirm(false)">
        Cancelar
      </button>

      <button class="btn-dark" onclick="responderConfirm(true)">
        Confirmar
      </button>
    </div>
  </div>
</div>

<script>
  console.log('Sistema iniciado');

  const SUPABASE_URL = 'https://rpohgkhkfzuorngtellg.supabase.co';

  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwb2hna2hrZnp1b3JuZ3RlbGxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NDA1NzcsImV4cCI6MjA5NDAxNjU3N30.ub-kiIOB2pm6o7Z5iv1dPuTE4hKwhmz6PraRgTts-Js';

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  console.log('Supabase conectado');

  let jogadores = [];
  let movimentacoes = [];
  let adminLiberado = false;
  let torneioAtualId = null;
  let todosTorneios = [];
  let todosValoresTorneios = [];

  client.auth.onAuthStateChange((event, session) => {

    adminLiberado = !!session;

    console.log('Estado de autenticação ADM:', event, adminLiberado);

    if (!adminLiberado) {
      window.location.href = `login.html?redirect=${encodeURIComponent(window.location.href)}`;
    }
  });

  async function exigirSessaoOuRedirecionar() {

    const { data } = await client.auth.getSession();

    if (!data.session) {
      window.location.href = `login.html?redirect=${encodeURIComponent(window.location.href)}`;
      return false;
    }

    adminLiberado = true;
    liberarAcoes();

    return true;
  }

  async function sair() {

    await client.auth.signOut();

    window.location.href = 'login.html';
  }

  function recarregarComDebounce() {
    carregarDados();
  }

  // Realtime com reconexão automática, recarga ao voltar para a aba e
  // conferência a cada 30 s (ver js/comum.js).
  iniciarRealtimeRobusto({
    nome: 'mesa-realtime',
    tabelas: ['movimentacoes', 'jogadores', 'configuracoes', 'torneios', 'torneio_valores'],
    aoMudar: () => carregarDados()
  });





  function escapeHtml(valor) {
    return String(valor ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));
  }

  let _resolveAlerta = null;
  let _resolveConfirm = null;

  function mostrarAlerta(mensagem) {

    return new Promise(resolve => {

      document.getElementById('alertaMensagem').textContent = mensagem;
      document.getElementById('modalAlerta').classList.add('aberto');

      _resolveAlerta = resolve;
    });
  }

  function confirmarAlerta() {

    document.getElementById('modalAlerta').classList.remove('aberto');

    if (_resolveAlerta) {
      const resolver = _resolveAlerta;
      _resolveAlerta = null;
      resolver();
    }
  }

  function mostrarConfirm(mensagem) {

    return new Promise(resolve => {

      document.getElementById('confirmMensagem').textContent = mensagem;
      document.getElementById('modalConfirm').classList.add('aberto');

      _resolveConfirm = resolve;
    });
  }

  function responderConfirm(valor) {

    document.getElementById('modalConfirm').classList.remove('aberto');

    if (_resolveConfirm) {
      const resolver = _resolveConfirm;
      _resolveConfirm = null;
      resolver(valor);
    }
  }

  // Uma carga por vez; se pedirem outra durante a carga, roda de novo no fim
  // (a tela nunca fica com dados mais velhos que o último pedido).
  function carregarDados() {
    return executarSerial('dados-mesa', carregarDadosAgora);
  }

  async function carregarDadosAgora() {

    console.log('Carregando dados do Supabase');

    const { data: jogadoresDB } = await client
      .from('jogadores')
      .select('*');

    // Todas as movimentações, em páginas de 1000 (o Supabase limita cada
    // consulta a 1000 linhas; antes o histórico antigo ficava incompleto).
    const movimentacoesDB = await buscarTodas(() => client
      .from('movimentacoes')
      .select('*')
      .order('id', { ascending: false }));

    const { data: configuracaoDB } = await client
      .from('configuracoes')
      .select('*')
      .eq('id', 1)
      .single();

    jogadores = jogadoresDB || [];
    jogadores.sort((a, b) => a.nome.localeCompare(b.nome));
    movimentacoes = movimentacoesDB || [];

    torneioAtualId = configuracaoDB?.torneio_atual_id || null;

    const { data: torneiosDB } = await client
      .from('torneios')
      .select('*')
      .order('criado_em', { ascending: false });

    todosTorneios = torneiosDB || [];

    const { data: valoresDB } = await client
      .from('torneio_valores')
      .select('*')
      .order('ordem', { ascending: true });

    todosValoresTorneios = valoresDB || [];

    console.log('Jogadores carregados:', jogadores.length);
    console.log('Movimentações carregadas:', movimentacoes.length);

    atualizarTela();
  }

  function atualizarTela() {

    console.log('Atualizando tela');

    const select = document.getElementById('jogadorSelect');

    select.innerHTML = '<option value="">Selecione o jogador</option>';

    jogadores.forEach((jogador, index) => {

      select.innerHTML += `
        <option value="${index}">${escapeHtml(jogador.nome)}</option>
      `;
    });

  }

  function abrirModalCadastro() {

    if (!adminLiberado) return;

    document.getElementById('cadastroNome').value = '';
    document.getElementById('cadastroTelefone').value = '';
    document.getElementById('cadastroCpf').value = '';

    document.getElementById('modalCadastro').classList.add('aberto');
  }

  function fecharModalCadastro() {

    document.getElementById('modalCadastro').classList.remove('aberto');
  }

  async function cadastrarJogador() {

    console.log('Tentando cadastrar jogador');

    if (!adminLiberado) {
      await mostrarAlerta('Modo ADM necessário');
      return;
    }

    const nome = document.getElementById('cadastroNome').value.trim();
    const telefone = document.getElementById('cadastroTelefone').value.trim();
    const cpf = document.getElementById('cadastroCpf').value.trim();

    if (!nome) return;

    const existe = jogadores.find(j =>
      j.nome.toLowerCase() === nome.toLowerCase() ||
      (cpf && j.cpf === cpf)
    );

    if (existe) {
      console.log('Jogador duplicado detectado');
      await mostrarAlerta('Jogador já cadastrado');
      return;
    }

    const btn = document.getElementById('btnCadastrarJogador');
    btn.classList.add('disabled');

    const { error } = await client
      .from('jogadores')
      .insert([
        {
          nome,
          telefone,
          cpf
        }
      ]);

    btn.classList.remove('disabled');

    if (error) {
      await mostrarAlerta('Erro ao cadastrar jogador');
      console.error(error);
      return;
    }

    console.log('Jogador cadastrado:', nome);

    jogadores.push({
      nome,
      telefone,
      cpf
    });

    atualizarTela();

    fecharModalCadastro();
  }

  let sugestoesAtuais = [];
  let indiceDestacado = 0;

  function destacarSugestao(novoIndice) {

    indiceDestacado = novoIndice;

    const itens = document.querySelectorAll('#sugestoesJogadores .sugestao-item');

    itens.forEach((item, i) => {
      item.classList.toggle('sugestao-selecionada', i === indiceDestacado);
    });

    if (itens[indiceDestacado]) {
      itens[indiceDestacado].scrollIntoView({ block: 'nearest' });
    }
  }

  function selecionarJogadorPesquisa(jogador) {

    console.log('Jogador selecionado:', jogador.nome);

    document.getElementById('pesquisaJogador').value = jogador.nome;

    const indexJogador = jogadores.findIndex(j => j.nome === jogador.nome);

    document.getElementById('jogadorSelect').value = indexJogador;

    document.getElementById('sugestoesJogadores').style.display = 'none';
  }

  function filtrarJogadores() {

    const pesquisa = document.getElementById('pesquisaJogador').value.toLowerCase();

    console.log('Pesquisando jogador:', pesquisa);

    const sugestoes = document.getElementById('sugestoesJogadores');

    sugestoes.innerHTML = '';
    sugestoesAtuais = [];

    if (!pesquisa) {
      sugestoes.style.display = 'none';
      return;
    }

    const filtrados = jogadores
      .filter(j =>
        j.ativo !== false &&
        j.nome.toLowerCase().includes(pesquisa)
      )
      .sort((a, b) => {

        const aNome = a.nome.toLowerCase();
        const bNome = b.nome.toLowerCase();

        const aStarts = aNome.startsWith(pesquisa);
        const bStarts = bNome.startsWith(pesquisa);

        if (aStarts && !bStarts) return -1;
        if (!aStarts && bStarts) return 1;

        return aNome.localeCompare(bNome);
      });

    console.log('Sugestões encontradas:', filtrados.length);

    sugestoesAtuais = filtrados;

    if (filtrados.length === 0) {
      sugestoes.style.display = 'none';
      return;
    }

    sugestoes.style.display = 'block';

    filtrados.forEach((jogador) => {

      const div = document.createElement('div');

      div.className = 'sugestao-item';

      div.innerHTML = `<strong>${escapeHtml(jogador.nome)}</strong>`;

      div.onclick = () => {
        selecionarJogadorPesquisa(jogador);
      };

      sugestoes.appendChild(div);
    });

    destacarSugestao(0);
  }

  document.getElementById('pesquisaJogador')
    .addEventListener('keydown', function(e) {

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (sugestoesAtuais.length === 0) return;
        destacarSugestao(Math.min(indiceDestacado + 1, sugestoesAtuais.length - 1));
        return;
      }

      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (sugestoesAtuais.length === 0) return;
        destacarSugestao(Math.max(indiceDestacado - 1, 0));
        return;
      }

      if (e.key === 'Enter') {

        e.preventDefault();

        if (sugestoesAtuais[indiceDestacado]) {
          selecionarJogadorPesquisa(sugestoesAtuais[indiceDestacado]);
        }
      }
  });

  let entradaPendente = null;
  let modalidadeSelecionada = 'Não Pago';

  async function adicionarEntrada() {

    console.log('Adicionando entrada');

    if (!adminLiberado) return;

    const jogador = jogadores[
      document.getElementById('jogadorSelect').value
    ];

    const valor = parseFloat(
      document.getElementById('entrada').value
    );

    if (!jogador) {
      await mostrarAlerta('Selecione um jogador antes de continuar');
      return;
    }

    if (isNaN(valor) || valor <= 0) {
      await mostrarAlerta('Informe um valor válido');
      return;
    }

    entradaPendente = { jogador, valor };

    abrirModalConfirmacao();
  }

  function abrirModalConfirmacao() {

    selecionarModalidade('Não Pago');

    document.getElementById('modalResumo').textContent =
      `${entradaPendente.jogador.nome} — Entrada de ${formatarMoeda(entradaPendente.valor)}`;

    document.getElementById('modalConfirmacao').classList.add('aberto');
  }

  function fecharModalConfirmacao() {

    entradaPendente = null;

    document.getElementById('modalConfirmacao').classList.remove('aberto');
  }

  function selecionarModalidade(modalidade) {

    modalidadeSelecionada = modalidade;

    document.getElementById('btnModalidadeCash').classList.toggle('ativo', modalidade === 'Não Pago');
    document.getElementById('btnModalidadeTorneio').classList.toggle('ativo', modalidade === 'Pago');
  }

  async function confirmarEntradaComModalidade() {

    if (!entradaPendente) return;

    const { jogador, valor } = entradaPendente;
    const pago = modalidadeSelecionada === 'Pago';

    const btn = document.getElementById('btnConfirmarEntrada');
    btn.classList.add('disabled');

    const { error } = await client
      .from('movimentacoes')
      .insert([
        {
          jogador: jogador.nome,
          tipo: 'Entrada',
          valor,
          modalidade: 'Cash',
          pago,
          data: new Date().toISOString(),
          cpf: jogador.cpf,
          telefone: jogador.telefone
        }
      ]);

    btn.classList.remove('disabled');

    if (error) {
      await mostrarAlerta('Erro ao registrar entrada');
      console.error(error);
      return;
    }

    console.log('Entrada registrada:', valor, 'pago:', pago);

    document.getElementById('entrada').value = '';
    document.getElementById('pesquisaJogador').value = '';

    fecharModalConfirmacao();

    carregarDados();
  }

  let saidaPendente = null;
  async function adicionarSaida() {

    console.log('Adicionando saída');

    if (!adminLiberado) return;

    const jogador = jogadores[
      document.getElementById('jogadorSelect').value
    ];

    const valor = parseFloat(
      document.getElementById('saida').value
    );

    if (!jogador) {
      await mostrarAlerta('Selecione um jogador antes de continuar');
      return;
    }

    if (isNaN(valor) || valor <= 0) {
      await mostrarAlerta('Informe um valor válido');
      return;
    }

    saidaPendente = { jogador, valor };

    abrirModalConfirmacaoSaida();
  }

  function abrirModalConfirmacaoSaida() {

    document.getElementById('modalResumoSaida').textContent =
      `${saidaPendente.jogador.nome} — Saída de ${formatarMoeda(saidaPendente.valor)}`;

    document.getElementById('modalConfirmacaoSaida').classList.add('aberto');
  }

  function fecharModalConfirmacaoSaida() {

    saidaPendente = null;

    document.getElementById('modalConfirmacaoSaida').classList.remove('aberto');
  }

  async function confirmarSaidaComModalidade() {

    if (!saidaPendente) return;

    const { jogador, valor } = saidaPendente;
    const modalidade = 'Cash';

    const btn = document.getElementById('btnConfirmarSaida');
    btn.classList.add('disabled');

    const { error } = await client
      .from('movimentacoes')
      .insert([
        {
          jogador: jogador.nome,
          tipo: 'Saída',
          valor,
          modalidade,
          data: new Date().toISOString(),
          cpf: jogador.cpf,
          telefone: jogador.telefone
        }
      ]);

    btn.classList.remove('disabled');

    if (error) {
      await mostrarAlerta('Erro ao registrar saída');
      console.error(error);
      return;
    }

    console.log('Saída registrada:', valor, modalidade);

    document.getElementById('saida').value = '';
    document.getElementById('pesquisaJogador').value = '';

    fecharModalConfirmacaoSaida();

    carregarDados();
  }

  document.addEventListener('keydown', function(e) {

    if (e.key !== 'Escape') return;

    if (document.getElementById('modalConfirm').classList.contains('aberto')) {
      responderConfirm(false);
      return;
    }

    if (document.getElementById('modalAlerta').classList.contains('aberto')) {
      confirmarAlerta();
      return;
    }

    fecharMenu();
    fecharModalCadastro();
    fecharModalConfirmacao();
    fecharModalConfirmacaoSaida();
  });

  function liberarAcoes() {

    console.log('Liberando ações ADM');

    document.getElementById('btnAdmin').textContent = 'Sair';

    document.getElementById('btnAbrirCadastro')?.classList.remove('disabled');

    document.getElementById('btnEntrada').classList.remove('disabled');
    document.getElementById('btnSaida').classList.remove('disabled');
  }






  async function tratarHashInicial() {

    const hash = window.location.hash.replace('#', '');

    if (!hash) return;

    history.replaceState(null, '', window.location.pathname);

    const { data } = await client.auth.getSession();
    adminLiberado = !!data.session;

    if (hash === 'cadastro') {
      abrirModalCadastro();
    }
  }

  (async function inicializar() {

    const autenticado = await exigirSessaoOuRedirecionar();

    if (!autenticado) return;

    await carregarDados();
    await tratarHashInicial();
  })();
</script>

</body>
</html>
