<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Poker Club</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f3f3f3;
      font-family: Arial, sans-serif;
      color: #111;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      padding: 20px;
      margin-bottom: 16px;
    }

    h1, h2 {
      margin-top: 0;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
      font-size: 14px;
    }

    button {
      padding: 9px 13px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
    }

    .btn-dark {
      background: #111;
      color: white;
    }

    .btn-blue {
      background: #2563eb;
      color: white;
    }

    .btn-green {
      background: #16a34a;
      color: white;
    }

    .btn-red {
      background: #dc2626;
      color: white;
    }

    .btn-gray {
      background: #444;
      color: white;
    }

    .disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .oculto {
      display: none;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 16px;
    }

    .modal-overlay.aberto {
      display: flex;
    }

    .modal-box {
      background: white;
      padding: 24px;
      max-width: 400px;
      width: 100%;
    }

    .modal-resumo {
      color: #444;
      margin-bottom: 16px;
    }

    .modalidade-opcoes {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .modalidade-btn {
      flex: 1;
      background: #eee;
      color: #111;
      box-shadow: none;
      padding: 12px;
    }

    .modalidade-btn.ativo {
      background: #2563eb;
      color: white;
    }

    .modal-acoes {
      display: flex;
      gap: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      table-layout: fixed;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #eee;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .autocomplete-wrapper {
      position: relative;
      margin-bottom: 10px;
      height: 48px;
    }

    .pesquisa-wrapper {
      position: relative;
      margin-bottom: 10px;
    }

    #autocompleteHint,
    #pesquisaJogador {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
    }

    #autocompleteHint {
      color: #cbd5e1;
      background: transparent;
      pointer-events: none;
      z-index: 1;
      border-color: transparent;
      box-shadow: none;
      font-weight: 500;
    }

    #pesquisaJogador {
      background: transparent;
      z-index: 2;
      position: relative;
      color: #111;
    }

    .positivo {
      color: green;
      font-weight: bold;
    }

    .negativo {
      color: red;
      font-weight: bold;
    }

    #sugestoesJogadores,
    #sugestoesJogadoresRelatorio {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      width: 100%;
      z-index: 1000;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }

    .sugestao-item {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .sugestao-item:hover,
    .sugestao-selecionada {
      background: #f0f0f0;
    }

    .flex {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .flex > * {
      flex: 1;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 14px;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        font-size: 24px;
      }

      th, td {
        padding: 8px;
        font-size: 14px;
      }

      button {
        width: auto;
      }

      .flex button {
        width: 100%;
      }

      .flex {
        flex-direction: column;
      }

      .topbar {
        flex-direction: row;
        align-items: center;
      }

      table {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="topbar">
    <h1>RPG Poker Club</h1>

    <div style="display:flex;gap:8px;">
      <button id="btnAbrirCadastro" class="btn-dark disabled" onclick="abrirModalCadastro()">
        Cadastrar Jogador
      </button>

      <button id="btnAdmin" class="btn-gray" onclick="toggleAdmin()">
        ADM
      </button>
    </div>
  </div>

  <div class="card">
    <h2>Registrar Movimentação</h2>

    <div class="autocomplete-wrapper">
      <input
        type="text"
        id="autocompleteHint"
        tabindex="-1"
        readonly
      >

      <input
        enterkeyhint="done"
        autocapitalize="words"
        spellcheck="false"
        type="text"
        id="pesquisaJogador"
        placeholder="Pesquisar jogador"
        autocomplete="off"
        oninput="filtrarJogadores()"
      >

      <div id="sugestoesJogadores"></div>
    </div>

    <select id="jogadorSelect" class="oculto"></select>

    <div class="flex">
      <div>
        <input type="number" id="entrada" placeholder="Entrada" min="0">

        <button id="btnEntrada" class="btn-blue disabled" onclick="adicionarEntrada()">
          Adicionar Entrada
        </button>
      </div>

      <div>
        <input type="number" id="saida" placeholder="Saída" min="0">

        <button id="btnSaida" class="btn-green disabled" onclick="adicionarSaida()">
          Adicionar Saída
        </button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="topbar">
      <h2>Mesa Atual</h2>

      <div style="display:flex;gap:8px;">
        <button id="btnDesfazer" class="btn-gray disabled" onclick="desfazerUltimaMovimentacao()">
          Desfazer Última
        </button>

        <button id="btnZerar" class="btn-red disabled" onclick="zerarMesa()">
          Zerar Mesa
        </button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Jogador</th>
          <th>Entrou</th>
          <th>Saiu</th>
          <th>Resultado</th>
        </tr>
      </thead>

      <tbody id="mesaAtual"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Relatório de Movimentações</h2>

    <div class="pesquisa-wrapper">
      <input
        enterkeyhint="done"
        autocapitalize="words"
        spellcheck="false"
        type="text"
        id="pesquisaJogadorRelatorio"
        placeholder="Pesquisar jogador"
        autocomplete="off"
        oninput="filtrarJogadoresRelatorio()"
      >

      <div id="sugestoesJogadoresRelatorio"></div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Data/Hora</th>
          <th>Jogador</th>
          <th>Tipo</th>
          <th>Modalidade</th>
          <th>Valor</th>
          <th>Imprimir</th>
        </tr>
      </thead>

      <tbody id="relatorio"></tbody>
    </table>

    <div style="margin-top:12px;text-align:center;">
      <button
        id="btnVerMais"
        class="btn-gray"
        onclick="verMaisRelatorio()"
        type="button"
      >
        Ver Mais
      </button>
    </div>
  </div>

</div>

<div id="modalCadastro" class="modal-overlay">
  <div class="modal-box">
    <h2>Cadastrar Jogador</h2>

    <input type="text" id="cadastroNome" placeholder="Nome">
    <input type="text" id="cadastroTelefone" placeholder="Telefone">
    <input type="text" id="cadastroCpf" placeholder="CPF">

    <div class="modal-acoes">
      <button class="btn-gray" onclick="fecharModalCadastro()">
        Cancelar
      </button>

      <button id="btnCadastrarJogador" class="btn-dark" onclick="cadastrarJogador()">
        Cadastrar Jogador
      </button>
    </div>
  </div>
</div>

<div id="modalConfirmacao" class="modal-overlay">
  <div class="modal-box">
    <h2>Confirmar Entrada</h2>

    <p id="modalResumo" class="modal-resumo"></p>

    <div class="modalidade-opcoes">
      <button type="button" id="btnModalidadeCash" class="modalidade-btn ativo" onclick="selecionarModalidade('Cash')">
        Cash
      </button>

      <button type="button" id="btnModalidadeTorneio" class="modalidade-btn" onclick="selecionarModalidade('Torneio')">
        Torneio
      </button>
    </div>

    <div class="modal-acoes">
      <button class="btn-gray" onclick="fecharModalConfirmacao()">
        Cancelar
      </button>

      <button id="btnConfirmarEntrada" class="btn-blue" onclick="confirmarEntradaComModalidade()">
        Confirmar
      </button>
    </div>
  </div>
</div>

<div id="modalConfirmacaoSaida" class="modal-overlay">
  <div class="modal-box">
    <h2>Confirmar Saída</h2>

    <p id="modalResumoSaida" class="modal-resumo"></p>

    <div class="modalidade-opcoes">
      <button type="button" id="btnModalidadeSaidaPagamento" class="modalidade-btn ativo" onclick="selecionarModalidadeSaida('Pagamento')">
        Pagamento
      </button>

      <button type="button" id="btnModalidadeSaidaCashout" class="modalidade-btn" onclick="selecionarModalidadeSaida('Cashout')">
        Cashout
      </button>
    </div>

    <div class="modal-acoes">
      <button class="btn-gray" onclick="fecharModalConfirmacaoSaida()">
        Cancelar
      </button>

      <button id="btnConfirmarSaida" class="btn-green" onclick="confirmarSaidaComModalidade()">
        Confirmar
      </button>
    </div>
  </div>
</div>

<script>
  console.log('Sistema iniciado');

  const SUPABASE_URL = 'https://rpohgkhkfzuorngtellg.supabase.co';

  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwb2hna2hrZnp1b3JuZ3RlbGxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NDA1NzcsImV4cCI6MjA5NDAxNjU3N30.ub-kiIOB2pm6o7Z5iv1dPuTE4hKwhmz6PraRgTts-Js';

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  console.log('Supabase conectado');

  let jogadores = [];
  let movimentacoes = [];
  let adminLiberado = false;
  let limiteRelatorio = 10;
  let mesaAtualId = 1;
  let filtroRelatorioJogador = '';

  const adminExpira = localStorage.getItem('adminExpira');

  if (adminExpira) {
    localStorage.removeItem('adminExpira');
  }

  client.auth.onAuthStateChange((event, session) => {

    adminLiberado = !!session;

    console.log('Estado de autenticação ADM:', event, adminLiberado);

    if (adminLiberado) {
      liberarAcoes();
    } else {
      bloquearAcoes();
    }
  });

  function escapeHtml(valor) {
    return String(valor ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));
  }

  async function carregarDados() {

    console.log('Carregando dados do Supabase');

    const { data: jogadoresDB } = await client
      .from('jogadores')
      .select('*');

    const { data: movimentacoesDB } = await client
      .from('movimentacoes')
      .select('*')
      .order('id', { ascending: false });

    const { data: configuracaoDB } = await client
      .from('configuracoes')
      .select('*')
      .eq('id', 1)
      .single();

    jogadores = jogadoresDB || [];
    movimentacoes = movimentacoesDB || [];

    mesaAtualId = configuracaoDB?.mesa_atual_id || 1;

    console.log('Jogadores carregados:', jogadores.length);
    console.log('Movimentações carregadas:', movimentacoes.length);

    atualizarTela();
  }

  function atualizarTela() {

    console.log('Atualizando tela');

    const mesa = document.getElementById('mesaAtual');
    const relatorio = document.getElementById('relatorio');
    const select = document.getElementById('jogadorSelect');

    mesa.innerHTML = '';
    relatorio.innerHTML = '';

    select.innerHTML = '<option value="">Selecione o jogador</option>';

    const movimentacoesMesa = movimentacoes.filter(
      mov => Number(mov.mesa_id || 1) === Number(mesaAtualId)
    );

    jogadores.forEach((jogador, index) => {

      let entrada = 0;
      let saida = 0;

      movimentacoesMesa.forEach(mov => {
        if (mov.jogador === jogador.nome) {

          if (mov.tipo === 'Entrada') {
            entrada += Number(mov.valor);
          }

          if (mov.tipo === 'Saída') {
            saida += Number(mov.valor);
          }
        }
      });

      if (entrada > 0 || saida > 0) {

        const saldo = saida - entrada;

        mesa.innerHTML += `
          <tr>
            <td>${escapeHtml(jogador.nome)}</td>
            <td>R$ ${entrada.toFixed(2)}</td>
            <td>R$ ${saida.toFixed(2)}</td>
            <td class="${saldo >= 0 ? 'positivo' : 'negativo'}">
              ${saldo >= 0 ? '+' : '-'} R$ ${Math.abs(saldo).toFixed(2)}
            </td>
          </tr>
        `;
      }

      select.innerHTML += `
        <option value="${index}">${escapeHtml(jogador.nome)}</option>
      `;
    });

    const movimentacoesFiltradas = filtroRelatorioJogador
      ? movimentacoes.filter(mov =>
          mov.jogador.toLowerCase().includes(filtroRelatorioJogador.toLowerCase())
        )
      : movimentacoes;

    const movimentacoesVisiveis = movimentacoesFiltradas.slice(0, limiteRelatorio);

    console.log('Renderizando movimentações:', movimentacoesVisiveis.length);

    movimentacoesVisiveis.forEach(mov => {

      relatorio.innerHTML += `
        <tr>
          <td>${new Date(mov.data).toLocaleString('pt-BR', {
              day: '2-digit',
              month: '2-digit',
              year: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            })}</td>
          <td>${escapeHtml(mov.jogador)}</td>
          <td>${escapeHtml(mov.tipo)}</td>
          <td>${escapeHtml(mov.modalidade || '-')}</td>
          <td>R$ ${Number(mov.valor).toFixed(2)}</td>
          <td>
            <button class="btn-dark" onclick="imprimirMovimentacaoPorId(${mov.id})">
              Imprimir
            </button>
          </td>
        </tr>
      `;
    });
  }

  function abrirModalCadastro() {

    if (!adminLiberado) return;

    document.getElementById('cadastroNome').value = '';
    document.getElementById('cadastroTelefone').value = '';
    document.getElementById('cadastroCpf').value = '';

    document.getElementById('modalCadastro').classList.add('aberto');
  }

  function fecharModalCadastro() {

    document.getElementById('modalCadastro').classList.remove('aberto');
  }

  async function cadastrarJogador() {

    console.log('Tentando cadastrar jogador');

    if (!adminLiberado) {
      alert('Modo ADM necessário');
      return;
    }

    const nome = document.getElementById('cadastroNome').value.trim();
    const telefone = document.getElementById('cadastroTelefone').value.trim();
    const cpf = document.getElementById('cadastroCpf').value.trim();

    if (!nome) return;

    const existe = jogadores.find(j =>
      j.nome.toLowerCase() === nome.toLowerCase() ||
      (cpf && j.cpf === cpf)
    );

    if (existe) {
      console.log('Jogador duplicado detectado');
      alert('Jogador já cadastrado');
      return;
    }

    const btn = document.getElementById('btnCadastrarJogador');
    btn.classList.add('disabled');

    const { error } = await client
      .from('jogadores')
      .insert([
        {
          nome,
          telefone,
          cpf
        }
      ]);

    btn.classList.remove('disabled');

    if (error) {
      alert('Erro ao cadastrar jogador');
      console.error(error);
      return;
    }

    console.log('Jogador cadastrado:', nome);

    jogadores.push({
      nome,
      telefone,
      cpf
    });

    atualizarTela();

    fecharModalCadastro();
  }

  const pesquisaInput = document.getElementById('pesquisaJogador');
  const hintInput = document.getElementById('autocompleteHint');

  function filtrarJogadores() {

    const pesquisa = document.getElementById('pesquisaJogador').value.toLowerCase();

    console.log('Pesquisando jogador:', pesquisa);

    const sugestoes = document.getElementById('sugestoesJogadores');

    sugestoes.innerHTML = '';

    if (!pesquisa) {
      sugestoes.style.display = 'none';
      hintInput.value = '';
      return;
    }

    const filtrados = jogadores
      .filter(j =>
        j.nome.toLowerCase().includes(pesquisa)
      )
      .sort((a, b) => {

        const aNome = a.nome.toLowerCase();
        const bNome = b.nome.toLowerCase();

        const aStarts = aNome.startsWith(pesquisa);
        const bStarts = bNome.startsWith(pesquisa);

        if (aStarts && !bStarts) return -1;
        if (!aStarts && bStarts) return 1;

        return aNome.localeCompare(bNome);
      });

    console.log('Sugestões encontradas:', filtrados.length);

    if (filtrados.length === 0) {
      sugestoes.style.display = 'none';
      hintInput.value = '';
      return;
    }

    hintInput.value = filtrados[0].nome;

    sugestoes.style.display = 'block';

    filtrados.forEach((jogador, index) => {

      const div = document.createElement('div');

      div.className = 'sugestao-item';

      if (index === 0) {
        div.classList.add('sugestao-selecionada');
      }

      div.innerHTML = `
        <strong>${escapeHtml(jogador.nome)}</strong><br>
        <small>${escapeHtml(jogador.telefone || '')}</small>
      `;

      div.onclick = () => {

        console.log('Jogador selecionado:', jogador.nome);

        document.getElementById('pesquisaJogador').value = jogador.nome;
        hintInput.value = jogador.nome;

        const indexJogador = jogadores.findIndex(j => j.nome === jogador.nome);

        document.getElementById('jogadorSelect').value = indexJogador;

        sugestoes.style.display = 'none';
      };

      sugestoes.appendChild(div);
    });
  }

  document.getElementById('pesquisaJogador')
    .addEventListener('keydown', function(e) {

      console.log('Tecla pressionada:', e.key);

      if ((e.key === 'Tab' || e.key === 'ArrowRight') && hintInput.value) {
        e.preventDefault();
        pesquisaInput.value = hintInput.value;
        pesquisaInput.dispatchEvent(new Event('input'));
      }

      if (e.key === 'Enter') {

        e.preventDefault();

        const primeiro = document.querySelector('#sugestoesJogadores .sugestao-item');

        if (primeiro) {
          primeiro.click();
        }
      }
  });

  function filtrarJogadoresRelatorio() {

    const pesquisa = document.getElementById('pesquisaJogadorRelatorio').value;

    console.log('Pesquisando jogador no relatório:', pesquisa);

    filtroRelatorioJogador = pesquisa.trim();
    limiteRelatorio = 10;

    const sugestoes = document.getElementById('sugestoesJogadoresRelatorio');
    const termo = pesquisa.toLowerCase();

    sugestoes.innerHTML = '';

    if (!termo) {
      sugestoes.style.display = 'none';
      atualizarTela();
      return;
    }

    const filtrados = jogadores
      .filter(j => j.nome.toLowerCase().includes(termo))
      .sort((a, b) => {

        const aNome = a.nome.toLowerCase();
        const bNome = b.nome.toLowerCase();

        const aStarts = aNome.startsWith(termo);
        const bStarts = bNome.startsWith(termo);

        if (aStarts && !bStarts) return -1;
        if (!aStarts && bStarts) return 1;

        return aNome.localeCompare(bNome);
      });

    console.log('Sugestões encontradas no relatório:', filtrados.length);

    if (filtrados.length === 0) {
      sugestoes.style.display = 'none';
      atualizarTela();
      return;
    }

    sugestoes.style.display = 'block';

    filtrados.forEach((jogador, index) => {

      const div = document.createElement('div');

      div.className = 'sugestao-item';

      if (index === 0) {
        div.classList.add('sugestao-selecionada');
      }

      div.innerHTML = `<strong>${escapeHtml(jogador.nome)}</strong>`;

      div.onclick = () => {

        console.log('Jogador selecionado no filtro do relatório:', jogador.nome);

        document.getElementById('pesquisaJogadorRelatorio').value = jogador.nome;

        filtroRelatorioJogador = jogador.nome;

        sugestoes.style.display = 'none';

        atualizarTela();
      };

      sugestoes.appendChild(div);
    });

    atualizarTela();
  }

  document.getElementById('pesquisaJogadorRelatorio')
    .addEventListener('keydown', function(e) {

      if (e.key === 'Enter') {

        e.preventDefault();

        const primeiro = document.querySelector('#sugestoesJogadoresRelatorio .sugestao-item');

        if (primeiro) {
          primeiro.click();
        }
      }
  });

  let entradaPendente = null;
  let modalidadeSelecionada = 'Cash';

  function adicionarEntrada() {

    console.log('Adicionando entrada');

    if (!adminLiberado) return;

    const jogador = jogadores[
      document.getElementById('jogadorSelect').value
    ];

    const valor = parseFloat(
      document.getElementById('entrada').value
    );

    if (!jogador) {
      alert('Selecione um jogador antes de continuar');
      return;
    }

    if (isNaN(valor) || valor <= 0) {
      alert('Informe um valor válido');
      return;
    }

    entradaPendente = { jogador, valor };

    abrirModalConfirmacao();
  }

  function abrirModalConfirmacao() {

    selecionarModalidade('Cash');

    document.getElementById('modalResumo').textContent =
      `${entradaPendente.jogador.nome} — Entrada de R$ ${entradaPendente.valor.toFixed(2)}`;

    document.getElementById('modalConfirmacao').classList.add('aberto');
  }

  function fecharModalConfirmacao() {

    entradaPendente = null;

    document.getElementById('modalConfirmacao').classList.remove('aberto');
  }

  function selecionarModalidade(modalidade) {

    modalidadeSelecionada = modalidade;

    document.getElementById('btnModalidadeCash').classList.toggle('ativo', modalidade === 'Cash');
    document.getElementById('btnModalidadeTorneio').classList.toggle('ativo', modalidade === 'Torneio');
  }

  async function confirmarEntradaComModalidade() {

    if (!entradaPendente) return;

    const { jogador, valor } = entradaPendente;
    const modalidade = modalidadeSelecionada;

    const btn = document.getElementById('btnConfirmarEntrada');
    btn.classList.add('disabled');

    const { error } = await client
      .from('movimentacoes')
      .insert([
        {
          jogador: jogador.nome,
          tipo: 'Entrada',
          valor,
          modalidade,
          data: new Date().toISOString(),
          mesa_id: mesaAtualId,
          cpf: jogador.cpf,
          telefone: jogador.telefone
        }
      ]);

    btn.classList.remove('disabled');

    if (error) {
      alert('Erro ao registrar entrada');
      console.error(error);
      return;
    }

    console.log('Entrada registrada:', valor, modalidade);

    document.getElementById('entrada').value = '';
    document.getElementById('pesquisaJogador').value = '';
    hintInput.value = '';

    fecharModalConfirmacao();

    carregarDados();
  }

  let saidaPendente = null;
  let modalidadeSaidaSelecionada = 'Pagamento';

  function adicionarSaida() {

    console.log('Adicionando saída');

    if (!adminLiberado) return;

    const jogador = jogadores[
      document.getElementById('jogadorSelect').value
    ];

    const valor = parseFloat(
      document.getElementById('saida').value
    );

    if (!jogador) {
      alert('Selecione um jogador antes de continuar');
      return;
    }

    if (isNaN(valor) || valor <= 0) {
      alert('Informe um valor válido');
      return;
    }

    saidaPendente = { jogador, valor };

    abrirModalConfirmacaoSaida();
  }

  function abrirModalConfirmacaoSaida() {

    selecionarModalidadeSaida('Pagamento');

    document.getElementById('modalResumoSaida').textContent =
      `${saidaPendente.jogador.nome} — Saída de R$ ${saidaPendente.valor.toFixed(2)}`;

    document.getElementById('modalConfirmacaoSaida').classList.add('aberto');
  }

  function fecharModalConfirmacaoSaida() {

    saidaPendente = null;

    document.getElementById('modalConfirmacaoSaida').classList.remove('aberto');
  }

  function selecionarModalidadeSaida(modalidade) {

    modalidadeSaidaSelecionada = modalidade;

    document.getElementById('btnModalidadeSaidaPagamento').classList.toggle('ativo', modalidade === 'Pagamento');
    document.getElementById('btnModalidadeSaidaCashout').classList.toggle('ativo', modalidade === 'Cashout');
  }

  async function confirmarSaidaComModalidade() {

    if (!saidaPendente) return;

    const { jogador, valor } = saidaPendente;
    const modalidade = modalidadeSaidaSelecionada;

    const btn = document.getElementById('btnConfirmarSaida');
    btn.classList.add('disabled');

    const { error } = await client
      .from('movimentacoes')
      .insert([
        {
          jogador: jogador.nome,
          tipo: 'Saída',
          valor,
          modalidade,
          data: new Date().toISOString(),
          mesa_id: mesaAtualId,
          cpf: jogador.cpf,
          telefone: jogador.telefone
        }
      ]);

    btn.classList.remove('disabled');

    if (error) {
      alert('Erro ao registrar saída');
      console.error(error);
      return;
    }

    console.log('Saída registrada:', valor, modalidade);

    document.getElementById('saida').value = '';
    document.getElementById('pesquisaJogador').value = '';
    hintInput.value = '';

    fecharModalConfirmacaoSaida();

    carregarDados();
  }

  function imprimirMovimentacaoPorId(id) {

    const mov = movimentacoes.find(m => m.id === id);

    if (!mov) {
      console.log('Movimentação não encontrada:', id);
      return;
    }

    imprimirMovimentacao(mov);
  }

  function imprimirMovimentacao(mov) {

    console.log('Imprimindo movimentação');

    const janela = window.open('', '', 'width=420,height=700');

    janela.document.write(`
      <html>
      <head>
        <style>
          @page {
            size: 79mm auto;
            margin: 2mm;
          }

          html, body {
            width: 75mm;
            margin: 0;
            padding: 0;
            font-family: monospace;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.2;
            overflow: hidden;
          }

          h2, p {
            margin: 0;
            padding: 0;
          }

          .center {
            text-align: center;
          }

          .space {
            margin-top: 10px;
          }
        </style>
      </head>

      <body>

        <h2 style="text-align:center;margin:0 0 4px 0;font-size:22px;">
          RPG Poker Club
        </h2>

        <p style="text-align:center;margin:0 0 10px 0;font-size:14px;">
          Termo de Movimentação
        </p>

        <br>

        <p>
          Eu, ${escapeHtml(mov.jogador)}, declaro movimentação no valor de:
        </p>

        <h2 style="text-align:center;">
          R$ ${Number(mov.valor).toFixed(2)}
        </h2>

        <br>
        <p>
          Tipo: ${escapeHtml(mov.tipo)}
        </p>

        <p>
          Modalidade: ${escapeHtml(mov.modalidade || '-')}
        </p>

        <p>
          CPF: ${escapeHtml(mov.cpf || '-')}
        </p>

        <p>
          Telefone: ${escapeHtml(mov.telefone || '-')}
        </p>

        <br><br><br>
        ____________________________
        <br>
        Assinatura

        <br><br>

        ${escapeHtml(mov.data)}

      </body>
      </html>
    `);

    janela.document.close();

    janela.print();
  }

  async function toggleAdmin() {

    console.log('Alternando modo ADM');

    if (adminLiberado) {

      await client.auth.signOut();

      console.log('ADM desativado');

      return;
    }

    const email = prompt('E-mail do administrador');

    if (!email) return;

    const senha = prompt('Senha do administrador');

    if (!senha) return;

    const { error } = await client.auth.signInWithPassword({
      email,
      password: senha
    });

    if (error) {
      console.log('Falha no login ADM:', error.message);
      alert('E-mail ou senha incorretos');
      return;
    }

    console.log('ADM liberado');

    alert('Modo administrador liberado');
  }

  function liberarAcoes() {

    console.log('Liberando ações ADM');

    document.getElementById('btnDesfazer').classList.remove('disabled');

    document.getElementById('btnAbrirCadastro').classList.remove('disabled');

    document.getElementById('btnEntrada').classList.remove('disabled');
    document.getElementById('btnSaida').classList.remove('disabled');
    document.getElementById('btnZerar').classList.remove('disabled');
  }

  function bloquearAcoes() {

    console.log('Bloqueando ações ADM');

    document.getElementById('btnDesfazer').classList.add('disabled');

    document.getElementById('btnAbrirCadastro').classList.add('disabled');

    document.getElementById('btnEntrada').classList.add('disabled');
    document.getElementById('btnSaida').classList.add('disabled');
    document.getElementById('btnZerar').classList.add('disabled');

    fecharModalCadastro();
    fecharModalConfirmacao();
    fecharModalConfirmacaoSaida();
  }

  async function desfazerUltimaMovimentacao() {

    console.log('Tentando desfazer movimentação');

    if (!adminLiberado) return;

    if (movimentacoes.length === 0) {
      alert('Nenhuma movimentação encontrada');
      return;
    }

    if (!confirm('Desfazer última movimentação?')) return;

    const ultima = movimentacoes[0];

    const { error } = await client
      .from('movimentacoes')
      .delete()
      .eq('id', ultima.id);

    if (error) {
      alert('Erro ao desfazer movimentação');
      console.error(error);
      return;
    }

    console.log('Movimentação desfeita:', ultima.id);

    carregarDados();
  }

  function verMaisRelatorio() {

    console.log('Expandindo relatório');

    limiteRelatorio = limiteRelatorio + 10;

    console.log('Novo limite:', limiteRelatorio);

    atualizarTela();
  }

  async function zerarMesa() {

    console.log('Zerando mesa');

    if (!adminLiberado) return;

    if (!confirm('Deseja realmente zerar a mesa?')) return;

    const novoMesaId = Number(mesaAtualId) + 1;

    const { error } = await client
      .from('configuracoes')
      .update({
        mesa_atual_id: novoMesaId
      })
      .eq('id', 1);

    if (error) {
      console.error(error);
      alert('Erro ao zerar mesa');
      return;
    }

    mesaAtualId = novoMesaId;

    console.log('Nova mesa atual:', mesaAtualId);

    carregarDados();
  }

  carregarDados();
</script>

</body>
</html>
