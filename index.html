<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Poker Club</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f3f3f3;
      font-family: Arial, sans-serif;
      color: #111;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      padding: 20px;
      margin-bottom: 16px;
    }

    h1, h2 {
      margin-top: 0;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
      font-size: 14px;
    }

    button {
      padding: 9px 13px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
    }

    .btn-dark {
      background: #111;
      color: white;
    }

    .btn-blue {
      background: #2563eb;
      color: white;
    }

    .btn-green {
      background: #16a34a;
      color: white;
    }

    .btn-red {
      background: #dc2626;
      color: white;
    }

    .btn-gray {
      background: #444;
      color: white;
    }

    .disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      table-layout: fixed;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #eee;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .autocomplete-wrapper {
      position: relative;
      margin-bottom: 10px;
      height: 48px;
    }

    #autocompleteHint,
    #pesquisaJogador {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
    }

    #autocompleteHint {
      color: #9ca3af;
      background: white;
      pointer-events: none;
      z-index: 1;
    }

    #pesquisaJogador {
      background: transparent;
      z-index: 2;
    }

    .positivo {
      color: green;
      font-weight: bold;
    }

    .negativo {
      color: red;
      font-weight: bold;
    }

    #sugestoesJogadores {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      width: 100%;
      z-index: 1000;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }

    .sugestao-item {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .sugestao-item:hover,
    .sugestao-selecionada {
      background: #f0f0f0;
    }

    .flex {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .flex > * {
      flex: 1;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 14px;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        font-size: 24px;
      }

      th, td {
        padding: 8px;
        font-size: 14px;
      }

      button {
        width: auto;
      }

      .flex button {
        width: 100%;
      }

      .flex {
        flex-direction: column;
      }

      .topbar {
        flex-direction: row;
        align-items: center;
      }

      table {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="topbar">
    <h1>RPG Poker Club</h1>

    <button id="btnAdmin" class="btn-gray" onclick="toggleAdmin()">
      ADM
    </button>
  </div>

  <div class="card">
    <h2>Registrar Movimentação</h2>

    <div class="autocomplete-wrapper">
      <input
        type="text"
        id="autocompleteHint"
        tabindex="-1"
        readonly
      >

      <input
        enterkeyhint="done"
        autocapitalize="words"
        spellcheck="false"
        type="text"
        id="pesquisaJogador"
        placeholder="Pesquisar jogador"
        autocomplete="off"
        oninput="filtrarJogadores()"
      >

      <div id="sugestoesJogadores"></div>
    </div>

    <select id="jogadorSelect"></select>

    <div class="flex">
      <div>
        <input type="number" id="entrada" placeholder="Entrada" min="0">

        <button id="btnEntrada" class="btn-blue disabled" onclick="adicionarEntrada()">
          Adicionar Entrada
        </button>
      </div>

      <div>
        <input type="number" id="saida" placeholder="Saída" min="0">

        <button id="btnSaida" class="btn-green disabled" onclick="adicionarSaida()">
          Adicionar Saída
        </button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="topbar">
      <h2>Mesa Atual</h2>

      <div style="display:flex;gap:8px;">
        <button id="btnDesfazer" class="btn-gray disabled" onclick="desfazerUltimaMovimentacao()">
          Desfazer Última
        </button>

        <button id="btnZerar" class="btn-red disabled" onclick="zerarMesa()">
          Zerar Mesa
        </button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Jogador</th>
          <th>Entrou</th>
          <th>Saiu</th>
          <th>Resultado</th>
        </tr>
      </thead>

      <tbody id="mesaAtual"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Relatório de Movimentações</h2>

    <table>
      <thead>
        <tr>
          <th>Data/Hora</th>
          <th>Jogador</th>
          <th>Tipo</th>
          <th>Valor</th>
          <th>Imprimir</th>
        </tr>
      </thead>

      <tbody id="relatorio"></tbody>
    </table>

    <div style="margin-top:12px;text-align:center;">
      <button
        id="btnVerMais"
        class="btn-gray"
        onclick="verMaisRelatorio()"
        type="button"
      >
        Ver Mais
      </button>
    </div>
  </div>
    </table>
  </div>

  <div class="card">
    <h2>Cadastrar Jogador</h2>

    <input type="text" id="cadastroNome" placeholder="Nome">
    <input type="text" id="cadastroTelefone" placeholder="Telefone">
    <input type="text" id="cadastroCpf" placeholder="CPF">

    <button id="btnCadastrarJogador" class="btn-dark disabled" onclick="cadastrarJogador()">
      Cadastrar Jogador
    </button>
  </div>

<script>
  console.log('Sistema iniciado');

  const SUPABASE_URL = 'https://rpohgkhkfzuorngtellg.supabase.co';

  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwb2hna2hrZnp1b3JuZ3RlbGxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NDA1NzcsImV4cCI6MjA5NDAxNjU3N30.ub-kiIOB2pm6o7Z5iv1dPuTE4hKwhmz6PraRgTts-Js';

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  console.log('Supabase conectado');

  let jogadores = [];
  let movimentacoes = [];
  let adminLiberado = false;
  let limiteRelatorio = 10;
  let ultimaLimpezaMesa = localStorage.getItem('ultimaLimpezaMesa') || null;

  const adminExpira = localStorage.getItem('adminExpira');

  if (adminExpira && Date.now() < Number(adminExpira)) {
    adminLiberado = true;

    console.log('Sessão ADM restaurada');

    window.addEventListener('load', () => {
      liberarAcoes();
    });
  }

  async function carregarDados() {

    console.log('Carregando dados do Supabase');

    const { data: jogadoresDB } = await client
      .from('jogadores')
      .select('*');

    const { data: movimentacoesDB } = await client
      .from('movimentacoes')
      .select('*')
      .order('id', { ascending: false });

    jogadores = jogadoresDB || [];
    movimentacoes = movimentacoesDB || [];

    console.log('Jogadores carregados:', jogadores.length);
    console.log('Movimentações carregadas:', movimentacoes.length);

    atualizarTela();
  }

  function atualizarTela() {

    console.log('Atualizando tela');

    const mesa = document.getElementById('mesaAtual');
    const relatorio = document.getElementById('relatorio');
    const select = document.getElementById('jogadorSelect');

    mesa.innerHTML = '';
    relatorio.innerHTML = '';

    select.innerHTML = '<option value="">Selecione o jogador</option>';

    const movimentacoesMesa = ultimaLimpezaMesa
      ? movimentacoes.filter(mov => {
          const partes = mov.data.split(', ');

          if (!partes[0] || !partes[1]) return true;

          const dataBR = partes[0].split('/');

          const dataConvertida = new Date(
            `${dataBR[2]}-${dataBR[1]}-${dataBR[0]}T${partes[1]}`
          );

          return dataConvertida >= new Date(ultimaLimpezaMesa);
        })
      : movimentacoes;

    jogadores.forEach((jogador, index) => {

      let entrada = 0;
      let saida = 0;

      movimentacoesMesa.forEach(mov => {
        if (mov.jogador === jogador.nome) {

          if (mov.tipo === 'Entrada') {
            entrada += Number(mov.valor);
          }

          if (mov.tipo === 'Saída') {
            saida += Number(mov.valor);
          }
        }
      });

      if (entrada > 0 || saida > 0) {

        const saldo = saida - entrada;

        mesa.innerHTML += `
          <tr>
            <td>${jogador.nome}</td>
            <td>R$ ${entrada.toFixed(2)}</td>
            <td>R$ ${saida.toFixed(2)}</td>
            <td class="${saldo >= 0 ? 'positivo' : 'negativo'}">
              ${saldo >= 0 ? '+' : '-'} R$ ${Math.abs(saldo).toFixed(2)}
            </td>
          </tr>
        `;
      }

      select.innerHTML += `
        <option value="${index}">${jogador.nome}</option>
      `;
    });

    const movimentacoesVisiveis = movimentacoes.slice(0, limiteRelatorio);

    console.log('Renderizando movimentações:', movimentacoesVisiveis.length);

    movimentacoesVisiveis.forEach(mov => {

      relatorio.innerHTML += `
        <tr>
          <td>${mov.data}</td>
          <td>${mov.jogador}</td>
          <td>${mov.tipo}</td>
          <td>R$ ${Number(mov.valor).toFixed(2)}</td>
          <td>
            <button class="btn-dark" onclick='imprimirMovimentacao(${JSON.stringify(mov)})'>
              Imprimir
            </button>
          </td>
        </tr>
      `;
    });
  }

  async function cadastrarJogador() {

    console.log('Tentando cadastrar jogador');

    if (!adminLiberado) {
      alert('Modo ADM necessário');
      return;
    }

    const nome = document.getElementById('cadastroNome').value;
    const telefone = document.getElementById('cadastroTelefone').value;
    const cpf = document.getElementById('cadastroCpf').value;

    if (!nome) return;

    const existe = jogadores.find(j =>
      j.nome.toLowerCase() === nome.toLowerCase() ||
      (cpf && j.cpf === cpf)
    );

    if (existe) {
      console.log('Jogador duplicado detectado');
      alert('Jogador já cadastrado');
      return;
    }

    const { error } = await client
      .from('jogadores')
      .insert([
        {
          nome,
          telefone,
          cpf
        }
      ]);

    if (error) {
      alert('Erro ao cadastrar jogador');
      console.error(error);
      return;
    }

    console.log('Jogador cadastrado:', nome);

    jogadores.push({
      nome,
      telefone,
      cpf
    });

    document.getElementById('cadastroNome').value = '';
    document.getElementById('cadastroTelefone').value = '';
    document.getElementById('cadastroCpf').value = '';

    atualizarTela();

    if (adminLiberado) {
      liberarAcoes();
    }

    window.verMaisRelatorio = function verMaisRelatorio() {

    console.log('Expandindo relatório');

    limiteRelatorio = limiteRelatorio + 10;

    console.log('Novo limite:', limiteRelatorio);

    atualizarTela();
  }

  carregarDados();
  }

  const pesquisaInput = document.getElementById('pesquisaJogador');
  const hintInput = document.getElementById('autocompleteHint');

  function filtrarJogadores() {

    const pesquisa = document.getElementById('pesquisaJogador').value.toLowerCase();

    console.log('Pesquisando jogador:', pesquisa);

    const sugestoes = document.getElementById('sugestoesJogadores');

    sugestoes.innerHTML = '';

    if (!pesquisa) {
      sugestoes.style.display = 'none';
      hintInput.value = '';
      return;
    }

    const filtrados = jogadores.filter(j =>
      j.nome.toLowerCase().startsWith(pesquisa)
    );

    console.log('Sugestões encontradas:', filtrados.length);

    if (filtrados.length === 0) {
      sugestoes.style.display = 'none';
      hintInput.value = '';
      return;
    }

    hintInput.value = filtrados[0].nome;

    sugestoes.style.display = 'block';

    filtrados.forEach((jogador, index) => {

      const div = document.createElement('div');

      div.className = 'sugestao-item';

      if (index === 0) {
        div.classList.add('sugestao-selecionada');
      }

      div.innerHTML = `
        <strong>${jogador.nome}</strong><br>
        <small>${jogador.telefone || ''}</small>
      `;

      div.onclick = () => {

        console.log('Jogador selecionado:', jogador.nome);

        document.getElementById('pesquisaJogador').value = jogador.nome;
        hintInput.value = jogador.nome;

        const indexJogador = jogadores.findIndex(j => j.nome === jogador.nome);

        document.getElementById('jogadorSelect').value = indexJogador;

        sugestoes.style.display = 'none';
      };

      sugestoes.appendChild(div);
    });
  }

  document.getElementById('pesquisaJogador')
    .addEventListener('keydown', function(e) {

      console.log('Tecla pressionada:', e.key);

      if ((e.key === 'Tab' || e.key === 'ArrowRight') && hintInput.value) {
        e.preventDefault();
        pesquisaInput.value = hintInput.value;
        pesquisaInput.dispatchEvent(new Event('input'));
      }

      if (e.key === 'Enter') {

        e.preventDefault();

        const primeiro = document.querySelector('.sugestao-item');

        if (primeiro) {
          primeiro.click();
        }
      }
  });

  async function adicionarEntrada() {

    console.log('Adicionando entrada');

    if (!adminLiberado) return;

    const jogador = jogadores[
      document.getElementById('jogadorSelect').value
    ];

    const valor = parseFloat(
      document.getElementById('entrada').value
    );

    if (!jogador || isNaN(valor) || valor < 0) {
      console.log('Entrada negativa bloqueada');
      console.log('Entrada inválida');
      return;
    }

    if (!confirm('Confirmar entrada?')) return;

    await client
      .from('movimentacoes')
      .insert([
        {
          jogador: jogador.nome,
          tipo: 'Entrada',
          valor,
          data: new Date().toLocaleString('pt-BR'),
          cpf: jogador.cpf,
          telefone: jogador.telefone
        }
      ]);

    console.log('Entrada registrada:', valor);

    document.getElementById('entrada').value = '';

    carregarDados();
  }

  async function adicionarSaida() {

    console.log('Adicionando saída');

    if (!adminLiberado) return;

    const jogador = jogadores[
      document.getElementById('jogadorSelect').value
    ];

    const valor = parseFloat(
      document.getElementById('saida').value
    );

    if (!jogador || isNaN(valor) || valor < 0) {
      console.log('Saída negativa bloqueada');
      console.log('Saída inválida');
      return;
    }

    if (!confirm('Confirmar saída?')) return;

    await client
      .from('movimentacoes')
      .insert([
        {
          jogador: jogador.nome,
          tipo: 'Saída',
          valor,
          data: new Date().toLocaleString('pt-BR'),
          cpf: jogador.cpf,
          telefone: jogador.telefone
        }
      ]);

    console.log('Saída registrada:', valor);

    document.getElementById('saida').value = '';

    carregarDados();
  }

  function imprimirMovimentacao(mov) {

    console.log('Imprimindo movimentação');

    const janela = window.open('', '', 'width=420,height=700');

    janela.document.write(`
      <html>
      <head>
        <style>
          @page {
            size: 79mm auto;
            margin: 2mm;
          }

          html, body {
            width: 75mm;
            margin: 0;
            padding: 0;
            font-family: monospace;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.2;
            overflow: hidden;
          }

          h2, p {
            margin: 0;
            padding: 0;
          }

          .center {
            text-align: center;
          }

          .space {
            margin-top: 10px;
          }
        </style>
      </head>

      <body>

        <h2 style="text-align:center;margin:0 0 4px 0;font-size:22px;">
          RPG Poker Club
        </h2>

        <p style="text-align:center;margin:0 0 10px 0;font-size:14px;">
          Termo de Movimentação
        </p>

        <br>

        <p>
          Eu, ${mov.jogador}          
          declaro movimentação no valor de:
        </p>

        <h2 style="text-align:center;">
          R$ ${Number(mov.valor).toFixed(2)}
        </h2>
          
        <br>
        <p>
          Tipo: ${mov.tipo}
        </p>

        <p>
          CPF: ${mov.cpf || '-'}
        </p>

        <p>
          Telefone: ${mov.telefone || '-'}
        </p>

        <br><br><br>
        ____________________________
        <br>
        Assinatura

        <br><br>

        ${mov.data}

      </body>
      </html>
    `);

    janela.document.close();

    janela.print();
  }

  function toggleAdmin() {

    console.log('Alternando modo ADM');

    if (adminLiberado) {

      adminLiberado = false;

      localStorage.removeItem('adminExpira');

      bloquearAcoes();

      console.log('ADM desativado');

      return;
    }

    const senha = prompt('Digite a senha ADM');

    if (senha === '14563') {

      localStorage.setItem(
        'adminExpira',
        String(Date.now() + (8 * 60 * 60 * 1000))
      );

      adminLiberado = true;

      liberarAcoes();

      console.log('ADM liberado');

      alert('Modo administrador liberado');

    } else {
      console.log('Senha incorreta');
      alert('Senha incorreta');
    }
  }

  function liberarAcoes() {

    console.log('Liberando ações ADM');

    document.getElementById('btnDesfazer').classList.remove('disabled');

    document.getElementById('btnCadastrarJogador').classList.remove('disabled');

    document.getElementById('btnEntrada').classList.remove('disabled');
    document.getElementById('btnSaida').classList.remove('disabled');
    document.getElementById('btnZerar').classList.remove('disabled');
  }

  function bloquearAcoes() {

    console.log('Bloqueando ações ADM');

    document.getElementById('btnDesfazer').classList.add('disabled');

    document.getElementById('btnCadastrarJogador').classList.add('disabled');

    document.getElementById('btnEntrada').classList.add('disabled');
    document.getElementById('btnSaida').classList.add('disabled');
    document.getElementById('btnZerar').classList.add('disabled');
  }

  async function desfazerUltimaMovimentacao() {

    console.log('Tentando desfazer movimentação');

    if (!adminLiberado) return;

    if (movimentacoes.length === 0) {
      alert('Nenhuma movimentação encontrada');
      return;
    }

    if (!confirm('Desfazer última movimentação?')) return;

    const ultima = movimentacoes[0];

    const { error } = await client
      .from('movimentacoes')
      .delete()
      .eq('id', ultima.id);

    if (error) {
      alert('Erro ao desfazer movimentação');
      console.error(error);
      return;
    }

    console.log('Movimentação desfeita:', ultima.id);

    carregarDados();
  }

  function verMaisRelatorio() {

    console.log('Expandindo relatório');

    limiteRelatorio = limiteRelatorio + 10;

    console.log('Novo limite:', limiteRelatorio);

    atualizarTela();
  }

  function zerarMesa() {

    console.log('Zerando mesa');

    if (!adminLiberado) return;

    if (!confirm('Deseja realmente zerar a mesa?')) return;

    ultimaLimpezaMesa = new Date().toISOString();

    localStorage.setItem(
      'ultimaLimpezaMesa',
      ultimaLimpezaMesa
    );

    console.log('Mesa zerada em:', ultimaLimpezaMesa);

    atualizarTela();
  }

  carregarDados();
</script>

</body>
</html>
